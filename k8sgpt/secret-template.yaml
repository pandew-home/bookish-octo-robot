# K8sGPT AI Backend Secret Template
# DO NOT commit actual credentials to version control!
# This is a template for reference only.

---
# Option A: OpenAI Secret (Default)
apiVersion: v1
kind: Secret
metadata:
  name: k8sgpt-ai-secret
  namespace: k8sgpt-operator-system
  labels:
    app.kubernetes.io/name: k8sgpt-operator
    app.kubernetes.io/component: ai-backend
type: Opaque
stringData:
  openai-api-key: "sk-proj-REPLACE_WITH_YOUR_OPENAI_API_KEY"

---
# Option B: Amazon Bedrock Secret
# Uncomment and use this if using Bedrock instead of OpenAI
# apiVersion: v1
# kind: Secret
# metadata:
#   name: k8sgpt-ai-secret
#   namespace: k8sgpt-operator-system
#   labels:
#     app.kubernetes.io/name: k8sgpt-operator
#     app.kubernetes.io/component: ai-backend
# type: Opaque
# stringData:
#   # JSON format with AWS credentials
#   aws-credentials: |
#     {
#       "access_key": "AKIA_REPLACE_WITH_YOUR_ACCESS_KEY",
#       "secret_key": "REPLACE_WITH_YOUR_SECRET_KEY",
#       "session_token": "REPLACE_WITH_YOUR_SESSION_TOKEN",
#       "region": "us-east-1"
#     }

---
# Creation Commands (DO NOT run with template values!)
#
# For OpenAI:
# kubectl create secret generic k8sgpt-ai-secret \
#   --from-literal=openai-api-key=sk-proj-YOUR_ACTUAL_KEY \
#   -n k8sgpt-operator-system
#
# For Amazon Bedrock:
# cat > /tmp/aws-creds.json <<EOF
# {
#   "access_key": "YOUR_ACCESS_KEY",
#   "secret_key": "YOUR_SECRET_KEY",
#   "session_token": "YOUR_SESSION_TOKEN",
#   "region": "us-east-1"
# }
# EOF
# kubectl create secret generic k8sgpt-ai-secret \
#   --from-file=aws-credentials=/tmp/aws-creds.json \
#   -n k8sgpt-operator-system
# rm /tmp/aws-creds.json
