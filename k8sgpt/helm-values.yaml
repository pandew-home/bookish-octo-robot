replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceMonitor:
  enabled: true

metrics:
  enabled: true

# Emit structured JSON Result logs from the operator pod.
# Alloy can parse these directly rather than scraping free-form operator logs.
resultLogging:
  enabled: true
