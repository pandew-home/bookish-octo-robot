# Chart version: k8sgpt-operator/k8sgpt-operator v0.2.27
replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceMonitor:
  enabled: true

metrics:
  enabled: true

dynamicRBAC:
  enabled: true

# resultLogging creates a k8sgpt-metrics Service in the same namespace, which
# causes K8s to inject K8SGPT_METRICS_PORT=tcp://... into the k8sgpt pod.
# k8sgpt v0.4.29+ reads that env var as its metrics bind address and crashes.
# The operator controller already emits structured JSON logs that Alloy scrapes.
resultLogging:
  enabled: false
