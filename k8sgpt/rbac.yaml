# Custom RBAC for K8sGPT Operator — namespace-scoped secrets access only.
#
# The ServiceAccount, ClusterRole, ClusterRoleBinding, and leader-election
# Role/RoleBinding are all created and managed by the Helm chart
# (helm upgrade --install k8sgpt-operator k8sgpt-operator/k8sgpt-operator).
# Only the objects below are custom additions not covered by the chart.

---
# Namespace-scoped Role: restricts secret access to the AI secret only.
# Intentionally not cluster-scoped — secrets should never be cluster-readable.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8sgpt-operator-secrets-reader
  namespace: k8sgpt-operator-system
  labels:
    app.kubernetes.io/name: k8sgpt-operator
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
    resourceNames: ["k8sgpt-ai-secret"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8sgpt-operator-secrets-reader
  namespace: k8sgpt-operator-system
  labels:
    app.kubernetes.io/name: k8sgpt-operator
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8sgpt-operator-secrets-reader
subjects:
  - kind: ServiceAccount
    name: k8sgpt-operator
    namespace: k8sgpt-operator-system
