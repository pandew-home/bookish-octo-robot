apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8sgpt-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    # K8sGPT Operator Helm chart from official repository
    repoURL: https://charts.k8sgpt.ai
    chart: k8sgpt-operator
    targetRevision: 0.1.4  # Pin to stable version
    helm:
      releaseName: k8sgpt-operator
      values: |
        # Operator configuration
        controllerManager:
          manager:
            image:
              repository: ghcr.io/k8sgpt-ai/k8sgpt-operator
              tag: v0.1.4
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
        
        # Service account configuration
        serviceAccount:
          create: true
          name: k8sgpt-operator
        
        # RBAC configuration
        rbac:
          create: true
        
        # Metrics and monitoring
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true  # kube-prometheus-stack provides Prometheus Operator
  
  destination:
    server: https://kubernetes.default.svc
    namespace: k8sgpt-operator-system
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Health assessment
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
