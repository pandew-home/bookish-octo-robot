apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8sgpt-result-scraper
  namespace: monitoring
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: alloy-k8sgpt
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          containers:
            - name: scraper
              image: alpine/k8s:1.29.2
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "100m"
                  memory: "128Mi"
              env:
                - name: LOKI_URL
                  value: "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  kubectl get results.core.k8sgpt.ai --all-namespaces -o json | \
                  python3 -c "
                  import sys, json, urllib.request, urllib.error, time, datetime, os

                  loki_url = os.environ['LOKI_URL']
                  data = json.load(sys.stdin)
                  streams = []

                  for item in data['items']:
                      spec    = item['spec']
                      meta    = item['metadata']
                      created = meta.get('creationTimestamp', '')
                      try:
                          dt    = datetime.datetime.strptime(created, '%Y-%m-%dT%H:%M:%SZ')
                          ts_ns = str(int(dt.replace(tzinfo=datetime.timezone.utc).timestamp() * 1e9))
                      except Exception:
                          ts_ns = str(int(time.time() * 1e9))

                      error_text = ' | '.join(e.get('text', '') for e in spec.get('error', []))
                      details    = spec.get('details', '')
                      fix        = details[details.index('Solution:'):] if 'Solution:' in details else details

                      log_entry = {
                          'found_at': created,
                          'kind':     spec.get('kind', ''),
                          'resource': spec.get('name', ''),
                          'backend':  spec.get('backend', ''),
                          'error':    error_text,
                          'fix':      fix,
                      }
                      streams.append({
                          'stream': {
                              'source':    'k8sgpt-result',
                              'kind':      spec.get('kind', 'unknown'),
                              'namespace': meta.get('namespace', 'unknown'),
                          },
                          'values': [[ts_ns, json.dumps(log_entry)]]
                      })

                  if not streams:
                      print('No results found')
                      sys.exit(0)

                  payload = json.dumps({'streams': streams}).encode('utf-8')
                  req = urllib.request.Request(loki_url, data=payload,
                      headers={'Content-Type': 'application/json'}, method='POST')
                  try:
                      with urllib.request.urlopen(req) as resp:
                          print(f'Pushed {len(streams)} results to Loki (HTTP {resp.status})')
                  except urllib.error.HTTPError as e:
                      body = e.read().decode()
                      if e.code == 400 and ('out of order' in body or 'ignored' in body):
                          print('Results already ingested (duplicate), skipping')
                      else:
                          print(f'Loki push failed: {e.code} {body}', file=sys.stderr)
                          sys.exit(1)
                  "
