logging {
	level  = "info"
	format = "logfmt"
}

// ============================================================================
// Original Alloy Discovery Config
// ============================================================================

discovery.kubernetes "pods" {
	role = "pod"
}

discovery.kubernetes "nodes" {
	role = "node"
}

discovery.kubernetes "services" {
	role = "service"
}

discovery.kubernetes "endpoints" {
	role = "endpoints"
}

discovery.kubernetes "endpointslices" {
	role = "endpointslice"
}

discovery.kubernetes "ingresses" {
	role = "ingress"
}

// ============================================================================
// K8sGPT Integration - CR-only ingestion policy
// ============================================================================

// Intentionally no loki.source.kubernetes block for k8sgpt operator pods.
// K8sGPT Result CRs are pushed to Loki exclusively by k8sgpt-result-scraper.

// Write to Loki
loki.write "default" {
	endpoint {
		url = env("LOKI_URL")
	}

	external_labels = {
		cluster = env("CLUSTER_NAME"),
		source  = "alloy",
	}
}
