apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-k8sgpt
  namespace: monitoring  # Adjust to your Alloy namespace
  labels:
    app: alloy
    component: k8sgpt-integration
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-k8sgpt-reader-cleaner
  labels:
    app: alloy
    component: k8sgpt-integration
rules:
  # Read K8sGPT Result CRDs
  - apiGroups: ["core.k8sgpt.ai"]
    resources: ["results"]
    verbs: ["get", "list", "watch"]
  
  # Delete old K8sGPT Result CRDs
  - apiGroups: ["core.k8sgpt.ai"]
    resources: ["results"]
    verbs: ["delete"]
  
  # Read K8sGPT instances (for monitoring)
  - apiGroups: ["core.k8sgpt.ai"]
    resources: ["k8sgpts"]
    verbs: ["get", "list", "watch"]
  
  # Read pods and events for context (optional)
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  
  # Read namespaces for filtering
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-k8sgpt-reader-cleaner
  labels:
    app: alloy
    component: k8sgpt-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-k8sgpt-reader-cleaner
subjects:
  - kind: ServiceAccount
    name: alloy-k8sgpt
    namespace: monitoring  # Adjust to your Alloy namespace
