# SUPERSEDED — this manual patch is replaced by loki-stack-values.yaml.
# The deploy-k8sgpt.yml workflow now runs:
#   helm upgrade loki grafana/loki-stack -n monitoring --reuse-values --values loki-stack-values.yaml
# which sets loki.isDefault=false and survives Helm upgrades.
#
# Kept here as a fallback if loki-stack Helm values don't apply cleanly.
# Apply manually with: kubectl apply -f loki-datasource-fix.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-loki-stack
  namespace: monitoring
  labels:
    app: loki-stack
    grafana_datasource: "1"
    heritage: Helm
    release: loki
data:
  loki-stack-datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: "http://loki:3100"
      version: 1
      isDefault: false
      jsonData:
        maxLines: 1000
