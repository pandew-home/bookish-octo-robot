# Fixes the loki-loki-stack Helm-managed ConfigMap which ships with isDefault: true,
# conflicting with Prometheus (also isDefault: true) and blocking all Grafana datasource
# provisioning. This patch sets isDefault: false and adds an explicit uid so the
# K8sGPT dashboard can reference it reliably.
#
# Apply with: kubectl apply -f loki-datasource-fix.yaml
#
# NOTE: This will be overwritten if loki-stack Helm chart is upgraded.
# Re-apply after: helm upgrade loki grafana/loki-stack -n monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-loki-stack
  namespace: monitoring
  labels:
    app: loki-stack
    grafana_datasource: "1"
    heritage: Helm
    release: loki
data:
  loki-stack-datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: "http://loki:3100"
      version: 1
      isDefault: false
      jsonData:
        maxLines: 1000
