# SUPERSEDED — this manual patch is replaced by kube-prometheus-stack-values.yaml.
# The deploy-k8sgpt.yml workflow now runs:
#   helm upgrade kube-prometheus-stack ... --reuse-values --values kube-prometheus-stack-values.yaml
# which sets grafana.service.type=NodePort/nodePort=30300 and survives Helm upgrades.
#
# Kept here as a fallback if the Helm values override doesn't take effect.
# Apply manually with: kubectl apply -f grafana-nodeport-patch.yaml
apiVersion: v1
kind: Service
metadata:
  name: kube-prometheus-stack-grafana
  namespace: monitoring
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30300
      protocol: TCP
