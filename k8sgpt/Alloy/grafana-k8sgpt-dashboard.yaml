apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-k8sgpt-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k8sgpt-dashboard.json: |
    {
      "title": "K8sGPT Results",
      "uid": "k8sgpt-results",
      "tags": ["k8sgpt", "history"],
      "schemaVersion": 38,
      "version": 3,
      "refresh": "1m",
      "time": { "from": "now-24h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "severity",
            "label": "Severity",
            "description": "Derived from resource blast radius: Node/PVC=critical, StatefulSet/Deployment=high, Service/Ingress=medium, Pod/ReplicaSet/HPA=low. Escalates if error_count > 2.",
            "type": "custom",
            "query": "critical,high,medium,low",
            "current": { "value": "$__all", "text": "All" },
            "options": [
              { "value": "$__all",    "text": "All",      "selected": true },
              { "value": "critical",  "text": "Critical" },
              { "value": "high",      "text": "High" },
              { "value": "medium",    "text": "Medium" },
              { "value": "low",       "text": "Low" }
            ],
            "hide": 0,
            "includeAll": true,
            "multi": false,
            "refresh": 0,
            "sort": 0
          },
          {
            "name": "kind",
            "label": "Resource Kind",
            "description": "Filter by the Kubernetes resource type K8sGPT analysed",
            "type": "custom",
            "query": "Pod,Deployment,ReplicaSet,StatefulSet,Node,HorizontalPodAutoscaler,PersistentVolumeClaim,Service,Ingress",
            "current": { "value": "$__all", "text": "All" },
            "options": [
              { "value": "$__all",                  "text": "All",                    "selected": true },
              { "value": "Pod",                     "text": "Pod" },
              { "value": "Deployment",              "text": "Deployment" },
              { "value": "ReplicaSet",              "text": "ReplicaSet" },
              { "value": "StatefulSet",             "text": "StatefulSet" },
              { "value": "Node",                    "text": "Node" },
              { "value": "HorizontalPodAutoscaler", "text": "HorizontalPodAutoscaler" },
              { "value": "PersistentVolumeClaim",   "text": "PersistentVolumeClaim" },
              { "value": "Service",                 "text": "Service" },
              { "value": "Ingress",                 "text": "Ingress" }
            ],
            "hide": 0,
            "includeAll": true,
            "multi": false,
            "refresh": 0,
            "sort": 0
          },
          {
            "name": "lifecycle",
            "label": "Lifecycle",
            "description": "current = active, updated = re-analysed since last snapshot, historical = resolved",
            "type": "custom",
            "query": "current,updated,historical",
            "current": { "value": "$__all", "text": "All" },
            "options": [
              { "value": "$__all",    "text": "All",        "selected": true },
              { "value": "current",   "text": "Current" },
              { "value": "updated",   "text": "Updated" },
              { "value": "historical","text": "Historical" }
            ],
            "hide": 0,
            "includeAll": true,
            "multi": false,
            "refresh": 0,
            "sort": 0
          }
        ]
      },
      "panels": [

        {
          "id": 1,
          "title": "Critical & High Issues Over Time",
          "description": "Hourly snapshot count for critical and high severity issues. A persistent line means the problem has not been resolved. A gap means it was fixed — watch for it returning.",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 15 }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "critical" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }] },
              { "matcher": { "id": "byName", "options": "high" },     "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }] }
            ]
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (severity) (count_over_time({source=\"k8sgpt\", severity=~\"critical|high\"} [1h]))",
              "legendFormat": "{{severity}}",
              "queryType": "range"
            }
          ]
        },

        {
          "id": 2,
          "title": "Critical",
          "description": "Node or PVC issues — affects many workloads or risks data loss",
          "type": "stat",
          "gridPos": { "x": 0, "y": 8, "w": 6, "h": 4 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "red" }, "unit": "short" } },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "count_over_time({source=\"k8sgpt\", severity=\"critical\"} [1h])",
              "queryType": "range"
            }
          ]
        },

        {
          "id": 3,
          "title": "High",
          "description": "Deployment or StatefulSet issues — service-level outage",
          "type": "stat",
          "gridPos": { "x": 6, "y": 8, "w": 6, "h": 4 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "orange" }, "unit": "short" } },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "count_over_time({source=\"k8sgpt\", severity=\"high\"} [1h])",
              "queryType": "range"
            }
          ]
        },

        {
          "id": 4,
          "title": "Medium",
          "description": "Service or Ingress issues — connectivity impact",
          "type": "stat",
          "gridPos": { "x": 12, "y": 8, "w": 6, "h": 4 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "yellow" }, "unit": "short" } },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "count_over_time({source=\"k8sgpt\", severity=\"medium\"} [1h])",
              "queryType": "range"
            }
          ]
        },

        {
          "id": 5,
          "title": "Low",
          "description": "Pod, ReplicaSet, or HPA issues — isolated or scaling impact",
          "type": "stat",
          "gridPos": { "x": 18, "y": 8, "w": 6, "h": 4 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "blue" }, "unit": "short" } },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "count_over_time({source=\"k8sgpt\", severity=\"low\"} [1h])",
              "queryType": "range"
            }
          ]
        },

        {
          "id": 6,
          "title": "Active Issues Over Time — by Kind",
          "description": "Snapshot count per resource kind. Use this with the Kind filter to drill into a specific resource type and see if previous fix attempts held.",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 12, "w": 16, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2, "fillOpacity": 10 } }
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (kind) (count_over_time({source=\"k8sgpt\", severity=~\"${severity}\", kind=~\"${kind}\", lifecycle=~\"${lifecycle}\"} [1h]))",
              "legendFormat": "{{kind}}",
              "queryType": "range"
            }
          ]
        },

        {
          "id": 7,
          "title": "Issues by Lifecycle State",
          "description": "current = still active, updated = re-analysed, historical = resolved",
          "type": "piechart",
          "gridPos": { "x": 16, "y": 12, "w": 8, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": { "pieType": "pie", "legendDisplayMode": "table", "placement": "right" },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (lifecycle) (count_over_time({source=\"k8sgpt\", severity=~\"${severity}\"} [24h]))",
              "legendFormat": "{{lifecycle}}",
              "queryType": "range"
            }
          ]
        },

        {
          "id": 8,
          "title": "Full Issue History",
          "description": "Every hourly snapshot matching the filters above. Read the age_hours field to see how long an issue has been open. Gaps in the timeline indicate a fix attempt — repeated entries after a gap mean the fix did not hold.",
          "type": "logs",
          "gridPos": { "x": 0, "y": 20, "w": 24, "h": 16 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "dedupStrategy": "none",
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{source=\"k8sgpt\", severity=~\"${severity}\", kind=~\"${kind}\", lifecycle=~\"${lifecycle}\"}",
              "queryType": "range"
            }
          ]
        }

      ]
    }
