apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-k8sgpt-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k8sgpt-dashboard.json: |
    {
      "title": "K8sGPT Results",
      "uid": "k8sgpt-results",
      "tags": ["k8sgpt", "scaling"],
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "K8sGPT Operator Logs",
          "type": "logs",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "dedupStrategy": "none",
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{source=\"k8sgpt\"}",
              "legendFormat": "",
              "queryType": "range"
            }
          ]
        },
        {
          "id": 2,
          "title": "K8sGPT Analysis Activity (requests/min)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2 }
            }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(count_over_time({source=\"k8sgpt\"} |= \"request completed\" [1m]))",
              "legendFormat": "Analyses/min",
              "queryType": "range"
            }
          ]
        },
        {
          "id": 3,
          "title": "HPA & Scaling Issues",
          "type": "logs",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "dedupStrategy": "none",
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{source=\"k8sgpt\"} |= \"HorizontalPodAutoscaler\" or {source=\"k8sgpt\"} |= \"scaling\" or {source=\"k8sgpt\"} |= \"replica\"",
              "legendFormat": "",
              "queryType": "range"
            }
          ]
        },
        {
          "id": 4,
          "title": "All K8sGPT Findings (last 1h)",
          "type": "logs",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 10 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "dedupStrategy": "signature",
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{namespace=\"k8sgpt-operator-system\"}",
              "legendFormat": "",
              "queryType": "range"
            }
          ]
        }
      ]
    }
