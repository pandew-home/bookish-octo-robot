# Civo Traefik cluster override for kube-prometheus-stack
# Applied AFTER base.yaml: helm upgrade ... --values kube-prometheus-stack-values-base.yaml --values kube-prometheus-stack-values-civo-traefik.yaml
# Provides: Traefik ingress route to /grafana, Grafana server config for subpath serving

grafana:
  # Civo cluster uses Traefik; expose Grafana via Ingress at /grafana subpath
  service:
    type: ClusterIP  # Traefik ingress will handle external exposure; no NodePort needed
    port: 80

  # CRITICAL: Grafana server config for non-root routing
  # root_url + serve_from_sub_path allows Grafana to:
  # 1. Generate correct redirect URLs (e.g., /grafana/login not /login)
  # 2. Serve static assets from /grafana/public/ instead of /public/
  # 3. Handle cookie/session paths correctly for /grafana subpath
  grafana.ini:
    server:
      root_url: "http://17198d1a-3422-49ec-ad09-67ced6a5a0d6.k8s.civo.com/grafana"
      serve_from_sub_path: "true"

  ingress:
    enabled: true
    ingressClassName: traefik
    path: /grafana
    pathType: Prefix
    hosts:
      - 17198d1a-3422-49ec-ad09-67ced6a5a0d6.k8s.civo.com
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: "web"
      # TLS ready: uncomment when production cert-manager issuer is available
      # cert-manager.io/cluster-issuer: "letsencrypt-prod"
      # traefik.ingress.kubernetes.io/router.tls: "true"
      # traefik.ingress.kubernetes.io/router.tls.certresolver: "letsencrypt"

prometheus:
  prometheusSpec:
    # Traefik-specific config can go here if needed (e.g., service monitor selectors)
    pass
