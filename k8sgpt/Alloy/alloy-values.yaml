alloy:
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.kubernetes "nodes" {
        role = "node"
      }

      discovery.kubernetes "services" {
        role = "service"
      }

      // CR-only ingestion policy:
      // Do not scrape k8sgpt operator pod logs with Alloy.
      // K8sGPT Result CRs are pushed to Loki only by the k8sgpt-result-scraper CronJob.

      // Write to Loki
      loki.write "default" {
        endpoint {
          url = "http://loki.loki.svc:3100/loki/api/v1/push"
        }

        external_labels = {
          cluster = "bookish-octo-robot",  // Set via Kubernetes env variable (see extraEnv below)
          source  = "alloy",
        }
      }

  extraEnv:
    # Cluster identity: override in cluster-specific values file
    - name: CLUSTER_NAME
      value: "bookish-octo-robot"

serviceAccount:
  create: true

rbac:
  create: true
