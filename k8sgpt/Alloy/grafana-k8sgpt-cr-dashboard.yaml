apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-k8sgpt-cr-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k8sgpt-cr-dashboard.json: |
    {
      "title": "K8sGPT Live Results",
      "uid": "k8sgpt-cr-live",
      "tags": ["k8sgpt", "live", "crd"],
      "schemaVersion": 38,
      "version": 6,
      "refresh": "1m",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "🔴 Critical",
          "description": "Node or PVC issues — affects many workloads or risks data loss. Click column header to filter.",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "options": { 
            "colorMode": "background", 
            "graphMode": "none", 
            "textMode": "value",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "dark-red" },
              "unit": "short",
              "noValue": "0"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "marcusolsson-json-datasource", "uid": "k8sgpt-k8s-api" },
              "cacheDurationSeconds": 0,
              "fields": [
                { "jsonPath": "$.items[*].spec.kind", "name": "Kind", "type": "string" },
                { "jsonPath": "$.items[*].status.lifecycle", "name": "Lifecycle", "type": "string" }
              ],
              "method": "GET",
              "queryParams": "",
              "urlPath": "/apis/core.k8sgpt.ai/v1alpha1/results"
            }
          ],
          "transformations": [
            {
              "id": "filterByValue",
              "options": {
                "filters": [
                  { "fieldName": "Lifecycle", "config": { "id": "equal", "options": { "value": "current" } } },
                  { "fieldName": "Kind", "config": { "id": "regex", "options": { "value": "^(Node|PersistentVolumeClaim)$" } } }
                ],
                "type": "include",
                "match": "all"
              }
            },
            { "id": "reduce", "options": { "reducers": ["count"] } }
          ]
        },

        {
          "id": 2,
          "title": "🟠 High",
          "description": "Deployment or StatefulSet issues — service-level outage",
          "type": "stat",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "options": { 
            "colorMode": "background", 
            "graphMode": "none", 
            "textMode": "value",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "dark-orange" },
              "unit": "short",
              "noValue": "0"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "marcusolsson-json-datasource", "uid": "k8sgpt-k8s-api" },
              "cacheDurationSeconds": 0,
              "fields": [
                { "jsonPath": "$.items[*].spec.kind", "name": "Kind", "type": "string" },
                { "jsonPath": "$.items[*].status.lifecycle", "name": "Lifecycle", "type": "string" }
              ],
              "method": "GET",
              "queryParams": "",
              "urlPath": "/apis/core.k8sgpt.ai/v1alpha1/results"
            }
          ],
          "transformations": [
            {
              "id": "filterByValue",
              "options": {
                "filters": [
                  { "fieldName": "Lifecycle", "config": { "id": "equal", "options": { "value": "current" } } },
                  { "fieldName": "Kind", "config": { "id": "regex", "options": { "value": "^(Deployment|StatefulSet)$" } } }
                ],
                "type": "include",
                "match": "all"
              }
            },
            { "id": "reduce", "options": { "reducers": ["count"] } }
          ]
        },

        {
          "id": 3,
          "title": "🟡 Medium",
          "description": "Service or Ingress issues — connectivity impact",
          "type": "stat",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "options": { 
            "colorMode": "background", 
            "graphMode": "none", 
            "textMode": "value",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "dark-yellow" },
              "unit": "short",
              "noValue": "0"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "marcusolsson-json-datasource", "uid": "k8sgpt-k8s-api" },
              "cacheDurationSeconds": 0,
              "fields": [
                { "jsonPath": "$.items[*].spec.kind", "name": "Kind", "type": "string" },
                { "jsonPath": "$.items[*].status.lifecycle", "name": "Lifecycle", "type": "string" }
              ],
              "method": "GET",
              "queryParams": "",
              "urlPath": "/apis/core.k8sgpt.ai/v1alpha1/results"
            }
          ],
          "transformations": [
            {
              "id": "filterByValue",
              "options": {
                "filters": [
                  { "fieldName": "Lifecycle", "config": { "id": "equal", "options": { "value": "current" } } },
                  { "fieldName": "Kind", "config": { "id": "regex", "options": { "value": "^(Service|Ingress)$" } } }
                ],
                "type": "include",
                "match": "all"
              }
            },
            { "id": "reduce", "options": { "reducers": ["count"] } }
          ]
        },

        {
          "id": 4,
          "title": "🔵 Low",
          "description": "Pod, ReplicaSet, or HPA issues — isolated or scaling impact",
          "type": "stat",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "options": { 
            "colorMode": "background", 
            "graphMode": "none", 
            "textMode": "value",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "dark-blue" },
              "unit": "short",
              "noValue": "0"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "marcusolsson-json-datasource", "uid": "k8sgpt-k8s-api" },
              "cacheDurationSeconds": 0,
              "fields": [
                { "jsonPath": "$.items[*].spec.kind", "name": "Kind", "type": "string" },
                { "jsonPath": "$.items[*].status.lifecycle", "name": "Lifecycle", "type": "string" }
              ],
              "method": "GET",
              "queryParams": "",
              "urlPath": "/apis/core.k8sgpt.ai/v1alpha1/results"
            }
          ],
          "transformations": [
            {
              "id": "filterByValue",
              "options": {
                "filters": [
                  { "fieldName": "Lifecycle", "config": { "id": "equal", "options": { "value": "current" } } },
                  { "fieldName": "Kind", "config": { "id": "regex", "options": { "value": "^(Pod|ReplicaSet|HorizontalPodAutoscaler)$" } } }
                ],
                "type": "include",
                "match": "all"
              }
            },
            { "id": "reduce", "options": { "reducers": ["count"] } }
          ]
        },

        {
          "id": 5,
          "title": "🚨 Active Issues — Click column header to sort by Severity",
          "description": "Current issues (lifecycle=current) requiring attention. Sorted by Severity.",
          "type": "table",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 10 },
          "options": {
            "showHeader": true,
            "sortBy": [
              { "displayName": "Severity", "desc": false }
            ]
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Severity" },
                "properties": [
                  { "id": "custom.width", "value": 120 },
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "Node": { "text": "🔴 Critical", "color": "dark-red", "index": 0 } } },
                      { "type": "value", "options": { "PersistentVolumeClaim": { "text": "🔴 Critical", "color": "dark-red", "index": 0 } } },
                      { "type": "value", "options": { "StatefulSet": { "text": "🟠 High", "color": "dark-orange", "index": 1 } } },
                      { "type": "value", "options": { "Deployment": { "text": "🟠 High", "color": "dark-orange", "index": 1 } } },
                      { "type": "value", "options": { "Service": { "text": "🟡 Medium", "color": "dark-yellow", "index": 2 } } },
                      { "type": "value", "options": { "Ingress": { "text": "🟡 Medium", "color": "dark-yellow", "index": 2 } } },
                      { "type": "value", "options": { "Pod": { "text": "🔵 Low", "color": "dark-blue", "index": 3 } } },
                      { "type": "value", "options": { "ReplicaSet": { "text": "🔵 Low", "color": "dark-blue", "index": 3 } } },
                      { "type": "value", "options": { "HorizontalPodAutoscaler": { "text": "🔵 Low", "color": "dark-blue", "index": 3 } } }
                    ]
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  { "id": "custom.displayMode", "value": "color-background-solid" }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Kind" },
                "properties": [{ "id": "custom.width", "value": 160 }]
              },
              {
                "matcher": { "id": "byName", "options": "Resource" },
                "properties": [{ "id": "custom.width", "value": 250 }]
              },
              {
                "matcher": { "id": "byName", "options": "Error" },
                "properties": [
                  { "id": "custom.width", "value": 350 },
                  { "id": "custom.cellOptions", "value": { "type": "auto", "wrapText": true } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "AI Diagnosis" },
                "properties": [
                  { "id": "custom.width", "value": 400 },
                  { "id": "custom.cellOptions", "value": { "type": "auto", "wrapText": true } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "First Detected" },
                "properties": [
                  { "id": "custom.width", "value": 160 },
                  { "id": "unit", "value": "dateTimeAsIso" }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "marcusolsson-json-datasource", "uid": "k8sgpt-k8s-api" },
              "cacheDurationSeconds": 0,
              "fields": [
                { "jsonPath": "$.items[*].status.lifecycle", "name": "Lifecycle", "type": "string" },
                { "jsonPath": "$.items[*].spec.kind", "name": "Kind", "type": "string" },
                { "jsonPath": "$.items[*].spec.kind", "name": "Severity", "type": "string" },
                { "jsonPath": "$.items[*].metadata.namespace", "name": "Namespace", "type": "string" },
                { "jsonPath": "$.items[*].spec.name", "name": "Resource", "type": "string" },
                { "jsonPath": "$.items[*].spec.error[0].text", "name": "Error", "type": "string" },
                { "jsonPath": "$.items[*].spec.details", "name": "AI Diagnosis", "type": "string" },
                { "jsonPath": "$.items[*].metadata.creationTimestamp", "name": "First Detected", "type": "time" }
              ],
              "method": "GET",
              "queryParams": "",
              "urlPath": "/apis/core.k8sgpt.ai/v1alpha1/results"
            }
          ],
          "transformations": [
            {
              "id": "filterByValue",
              "options": {
                "filters": [
                  { "fieldName": "Lifecycle", "config": { "id": "equal", "options": { "value": "current" } } }
                ],
                "type": "include",
                "match": "any"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Lifecycle": true },
                "indexByName": {
                  "Severity": 0,
                  "Namespace": 1,
                  "Kind": 2,
                  "Resource": 3,
                  "Error": 4,
                  "AI Diagnosis": 5,
                  "First Detected": 6
                },
                "renameByName": {}
              }
            }
          ]
        },

        {
          "id": 6,
          "title": "📜 Historical Issues — Resolved",
          "description": "Resolved issues (lifecycle=historical) for reference. Sorted by most recent first.",
          "type": "table",
          "gridPos": { "x": 0, "y": 14, "w": 24, "h": 10 },
          "options": {
            "showHeader": true,
            "sortBy": [
              { "displayName": "First Detected", "desc": true }
            ]
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Severity" },
                "properties": [
                  { "id": "custom.width", "value": 120 },
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "Node": { "text": "🔴 Critical", "color": "semi-dark-red", "index": 0 } } },
                      { "type": "value", "options": { "PersistentVolumeClaim": { "text": "🔴 Critical", "color": "semi-dark-red", "index": 0 } } },
                      { "type": "value", "options": { "StatefulSet": { "text": "🟠 High", "color": "semi-dark-orange", "index": 1 } } },
                      { "type": "value", "options": { "Deployment": { "text": "🟠 High", "color": "semi-dark-orange", "index": 1 } } },
                      { "type": "value", "options": { "Service": { "text": "🟡 Medium", "color": "semi-dark-yellow", "index": 2 } } },
                      { "type": "value", "options": { "Ingress": { "text": "🟡 Medium", "color": "semi-dark-yellow", "index": 2 } } },
                      { "type": "value", "options": { "Pod": { "text": "🔵 Low", "color": "semi-dark-blue", "index": 3 } } },
                      { "type": "value", "options": { "ReplicaSet": { "text": "🔵 Low", "color": "semi-dark-blue", "index": 3 } } },
                      { "type": "value", "options": { "HorizontalPodAutoscaler": { "text": "🔵 Low", "color": "semi-dark-blue", "index": 3 } } }
                    ]
                  },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  { "id": "custom.displayMode", "value": "color-background-solid" }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Kind" },
                "properties": [{ "id": "custom.width", "value": 160 }]
              },
              {
                "matcher": { "id": "byName", "options": "Resource" },
                "properties": [{ "id": "custom.width", "value": 250 }]
              },
              {
                "matcher": { "id": "byName", "options": "Error" },
                "properties": [
                  { "id": "custom.width", "value": 350 },
                  { "id": "custom.cellOptions", "value": { "type": "auto", "wrapText": true } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "AI Diagnosis" },
                "properties": [
                  { "id": "custom.width", "value": 400 },
                  { "id": "custom.cellOptions", "value": { "type": "auto", "wrapText": true } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "First Detected" },
                "properties": [
                  { "id": "custom.width", "value": 160 },
                  { "id": "unit", "value": "dateTimeAsIso" }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "marcusolsson-json-datasource", "uid": "k8sgpt-k8s-api" },
              "cacheDurationSeconds": 0,
              "fields": [
                { "jsonPath": "$.items[*].status.lifecycle", "name": "Lifecycle", "type": "string" },
                { "jsonPath": "$.items[*].spec.kind", "name": "Kind", "type": "string" },
                { "jsonPath": "$.items[*].spec.kind", "name": "Severity", "type": "string" },
                { "jsonPath": "$.items[*].metadata.namespace", "name": "Namespace", "type": "string" },
                { "jsonPath": "$.items[*].spec.name", "name": "Resource", "type": "string" },
                { "jsonPath": "$.items[*].spec.error[0].text", "name": "Error", "type": "string" },
                { "jsonPath": "$.items[*].spec.details", "name": "AI Diagnosis", "type": "string" },
                { "jsonPath": "$.items[*].metadata.creationTimestamp", "name": "First Detected", "type": "time" }
              ],
              "method": "GET",
              "queryParams": "",
              "urlPath": "/apis/core.k8sgpt.ai/v1alpha1/results"
            }
          ],
          "transformations": [
            {
              "id": "filterByValue",
              "options": {
                "filters": [
                  { "fieldName": "Lifecycle", "config": { "id": "equal", "options": { "value": "historical" } } }
                ],
                "type": "include",
                "match": "any"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Lifecycle": true },
                "indexByName": {
                  "Severity": 0,
                  "Namespace": 1,
                  "Kind": 2,
                  "Resource": 3,
                  "Error": 4,
                  "AI Diagnosis": 5,
                  "First Detected": 6
                },
                "renameByName": {}
              }
            }
          ]
        }
      ]
    }
