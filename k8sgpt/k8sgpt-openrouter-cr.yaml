apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt-openrouter
  namespace: k8sgpt-operator-system
  labels:
    git-sha: "1121c46"
spec:
  version: v0.4.31
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  ai:
    enabled: true
    backend: openai
    model: qwen/qwen3-coder
    baseUrl: https://openrouter.ai/api/v1
    secret:
      name: k8sgpt-ai-secret
      key: openai-api-key
    # anonymized: false sends real resource names to the LLM for specific, actionable fixes
    anonymized: false
  analysis:
    interval: 5m
  noCache: false
  # Filters: analyzers relevant to this cluster's workload profile.
  # Includes all workload, networking, storage, scaling, and webhook types present on k3s.
  # OLM analyzers excluded — k3s does not run the Operator Lifecycle Manager.
  filters:
    - Pod
    - Log
    - Deployment
    - ReplicaSet
    - StatefulSet
    - Node
    - ConfigMap
    - PersistentVolumeClaim
    - Service
    - Ingress
    - CronJob
    - Job
    - HorizontalPodAutoscaler
    - PodDisruptionBudget
    - NetworkPolicy
    - MutatingWebhookConfiguration
    - ValidatingWebhookConfiguration
    - GatewayClass
    - Gateway
    - HTTPRoute
  # Do not set integrations at all. Any non-null integrations block currently
  # triggers operator AddIntegration and panics on nil Trivy response.
