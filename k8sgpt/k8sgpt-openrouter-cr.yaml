apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt-openrouter
  namespace: k8sgpt-operator-system
  labels:
    git-sha: "1121c46"
spec:
  version: v0.4.31
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  ai:
    enabled: true
    backend: openai
    model: qwen/qwen3-coder
    baseUrl: https://openrouter.ai/api/v1
    secret:
      name: k8sgpt-ai-secret
      key: openai-api-key
    # anonymized: false sends real resource names to the LLM for specific, actionable fixes
    anonymized: false
  analysis:
    interval: 5m
  noCache: true
  # Filters: list of analyzer kinds to run. Empty = run all built-in analyzers.
  # Explicitly list to ensure HorizontalPodAutoscaler and Node are included.
  filters:
    - Pod
    - Deployment
    - ReplicaSet
    - StatefulSet
    - Node
    - HorizontalPodAutoscaler
    - PersistentVolumeClaim
    - Service
    - Ingress
    - PodDisruptionBudget
    - MutatingWebhookConfiguration
    - ValidatingWebhookConfiguration
    - GatewayClass
    - Gateway
    - HTTPRoute
