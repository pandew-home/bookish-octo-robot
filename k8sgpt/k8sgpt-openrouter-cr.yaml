apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt-openrouter
  namespace: k8sgpt-operator-system
  labels:
    git-sha: "1121c46"
spec:
  version: v0.4.31
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  ai:
    enabled: true
    backend: openai
    model: openrouter/auto
    baseUrl: https://openrouter.ai/api/v1
    secret:
      name: k8sgpt-ai-secret
      key: openai-api-key
    # This enables the masking of sensitive cluster data
    anonymized: true
  analysis:
    interval: 2m
  noCache: false
  # Filters: list of analyzer kinds to run. Empty = run all built-in analyzers.
  # Explicitly list to ensure HorizontalPodAutoscaler and Node are included.
  filters:
    - Pod
    - Deployment
    - ReplicaSet
    - StatefulSet
    - Node
    - HorizontalPodAutoscaler
    - PersistentVolumeClaim
    - Service
    - Ingress
