image:
  repository: ghcr.io/gastownhall/gastown
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 1

# g4s.kube.medium nodes (2 vCPU / 3.7GB RAM).
# Go daemon + Dolt SQL server: ~110-200MB idle, bursty at agent spawn/handoff.
resources:
  requests:
    cpu: "150m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "768Mi"

service:
  type: ClusterIP
  # Web dashboard
  dashboardPort: 8080
  # Dolt MySQL-protocol SQL server
  doltPort: 3307

pvc:
  # Workspace: git repos, beads DBs, agent state.
  workspace:
    name: gastown-workspace
    mountPath: /gt
    size: 10Gi
    storageClass: longhorn
  # Dolt data — must be block-backed (ext4). Avoid NFS/VirtioFS (fsync corruption risk).
  dolt:
    name: gastown-dolt
    mountPath: /gt/.dolt-data
    size: 5Gi
    storageClass: longhorn

# Agent backend: point Claude Code CLI at OpenFang instead of Anthropic directly.
# ANTHROPIC_BASE_URL is forwarded by gastown's env allowlist to every spawned agent
# session (mayor, deacon, polecats, workers). Actual LLM auth lives in openfang's secret.
llm:
  baseUrl: "http://openfang:4200/v1"
  # Placeholder — Claude Code requires a non-empty key; OpenFang does the real auth.
  apiKey: "openfang"

# Required by gastown's docker-entrypoint.sh for git identity in workspaces.
git:
  user: "gastown"
  email: "gastown@cluster.local"

nameOverride: ""
fullnameOverride: ""
