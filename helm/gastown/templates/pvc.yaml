apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.pvc.workspace.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gastown.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.workspace.size }}
  storageClassName: {{ .Values.pvc.workspace.storageClass }}
---
# Dolt data volume — must be block-backed (ext4).
# VirtioFS and NFS mounts risk fsync corruption on Dolt WAL writes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.pvc.dolt.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gastown.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.dolt.size }}
  storageClassName: {{ .Values.pvc.dolt.storageClass }}
