apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gastown.fullname" . }}-agents
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gastown.labels" . | nindent 4 }}
# SAFe agent definitions from github.com/bybren-llc/safe-agentic-workflow.
# Mounted at /root/files/.claude/agents/ so every Claude Code session gastown spawns
# (mayor, deacon, polecats, crew, witness, refinery) has all 11 roles available.
data:
  bsa.md: {{ .Files.Get "files/.claude/agents/bsa.md" | quote }}
  tdm.md: {{ .Files.Get "files/.claude/agents/tdm.md" | quote }}
  system-architect.md: {{ .Files.Get "files/.claude/agents/system-architect.md" | quote }}
  be-developer.md: {{ .Files.Get "files/.claude/agents/be-developer.md" | quote }}
  fe-developer.md: {{ .Files.Get "files/.claude/agents/fe-developer.md" | quote }}
  data-engineer.md: {{ .Files.Get "files/.claude/agents/data-engineer.md" | quote }}
  data-provisioning-eng.md: {{ .Files.Get "files/.claude/agents/data-provisioning-eng.md" | quote }}
  tech-writer.md: {{ .Files.Get "files/.claude/agents/tech-writer.md" | quote }}
  qas.md: {{ .Files.Get "files/.claude/agents/qas.md" | quote }}
  security-engineer.md: {{ .Files.Get "files/.claude/agents/security-engineer.md" | quote }}
  rte.md: {{ .Files.Get "files/.claude/agents/rte.md" | quote }}
