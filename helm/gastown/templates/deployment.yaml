apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gastown.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gastown.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gastown.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gastown.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: false  # gastown requires root for git/tini/tmux operations
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gastown
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Persistent container — users exec in to drive agent workflows.
          command: ["/usr/bin/tini", "--", "sleep", "infinity"]
          ports:
            - name: dashboard
              containerPort: 8080
              protocol: TCP
            - name: dolt
              containerPort: 3307
              protocol: TCP
          env:
            # Route Claude Code CLI through OpenFang (OpenAI-compatible API).
            # Gastown's env allowlist forwards both vars to every agent session
            # (mayor, deacon, polecats, crew, witness, refinery).
            - name: ANTHROPIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "gastown.fullname" . }}-secrets
                  key: anthropic-base-url
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gastown.fullname" . }}-secrets
                  key: anthropic-api-key
            # Required by gastown entrypoint for git commit identity inside workspaces.
            - name: GIT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "gastown.fullname" . }}-secrets
                  key: git-user
            - name: GIT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "gastown.fullname" . }}-secrets
                  key: git-email
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: {{ .Values.pvc.workspace.mountPath }}
            - name: dolt-data
              mountPath: {{ .Values.pvc.dolt.mountPath }}
            # SAFe agent definitions — available to all Claude Code sessions as sub-agents.
            - name: claude-agents
              mountPath: /root/.claude/agents
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: dashboard
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: dashboard
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.workspace.name }}
        - name: dolt-data
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.dolt.name }}
        - name: claude-agents
          configMap:
            name: {{ include "gastown.fullname" . }}-agents
