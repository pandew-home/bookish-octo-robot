apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gastown.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gastown.labels" . | nindent 4 }}
type: Opaque
data:
  # Passed through by gastown's env allowlist to every agent session (mayor, polecats, workers).
  # Points Claude Code CLI at OpenFang; actual LLM auth is in openfang's own secret.
  anthropic-api-key: {{ .Values.llm.apiKey | b64enc | quote }}
  anthropic-base-url: {{ .Values.llm.baseUrl | b64enc | quote }}
  git-user: {{ .Values.git.user | b64enc | quote }}
  git-email: {{ .Values.git.email | b64enc | quote }}
