apiVersion: v1
kind: Service
metadata:
  name: {{ include "gastown.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gastown.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.dashboardPort }}
      targetPort: dashboard
      protocol: TCP
      name: dashboard
    - port: {{ .Values.service.doltPort }}
      targetPort: dolt
      protocol: TCP
      name: dolt
  selector:
    {{- include "gastown.selectorLabels" . | nindent 4 }}
