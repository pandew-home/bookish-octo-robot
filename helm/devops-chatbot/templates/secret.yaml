{{- if .Values.llm.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.llm.existingSecret | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "devops-chatbot.labels" . | nindent 4 }}
type: Opaque
data:
  llm-api-key: {{ .Values.llm.apiKey | b64enc | quote }}
  llm-provider: {{ .Values.llm.provider | b64enc | quote }}
  llm-model: {{ .Values.llm.model | b64enc | quote }}
{{- end }}
