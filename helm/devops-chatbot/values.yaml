image:
  repository: ghcr.io/pandew-home/bookish-octo-robot
  # CI always overrides this with --set image.tag=<git-sha>. Never deploy with "latest".
  # IMPORTANT: if a new tag fails to pull, kube will keep serving the previous pod,
  # which can hide config changes (for example /api/config output) and cause UI drift.
  tag: "0.0.0-dev"
  # pullPolicy: IfNotPresent keeps images cached locally after first pull.
  # For multi-cluster deployments with different registries, consider changing to Always.
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

namespace: devops-chatbot

podLabels:
  gitSha: ""

# Resource sizing: g4s.kube.medium nodes (2 vCPU / 3.7GB RAM).
# Cluster co-tenants: openfang (128Mi/512Mi), gastown (256Mi/768Mi).
# Observed idle: 4m CPU, 146Mi memory.
# Single replica recommended: colocated Vestige uses SQLite on the shared PVC.
resources:
  requests:
    # Chatbot + local Vestige MCP (embeddings/model cache warm path).
    cpu: "200m"
    memory: "512Mi"
  limits:
    # Vestige embedding model + LLM streaming + tool-result compaction.
    cpu: "1500m"
    memory: "1536Mi"

serviceAccount:
  # Bound only to core.k8sgpt.ai/results (see templates/rbac.yaml).
  # Live K8s tools use the user's session credentials, not this SA.
  name: devops-chatbot

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  # Source of truth for external chatbot URL.
  # Keep this in sync with k8s/ingress.yaml and cluster DNS host.
  host: 655d23be-a45d-49a6-a0e1-bd50ab91670c.k8s.civo.com
  # Path configuration for subpath hosting.
  # Chatbot is served at /devops-chat behind Traefik.
  # Keep app.apiBaseUrl and app.publicUrl aligned with this value.
  path: /chatbot
  pathType: Prefix
  extraPaths:
    - /api
    - /static
    - /favicon.ico
    - /manifest.json
  # TLS is disabled for test/dev clusters. For production clusters:
  # 1. Set tls.enabled: true
  # 2. Ensure cert-manager ClusterIssuer "letsencrypt-prod" exists
  # 3. Update host to your production domain
  tls:
    enabled: false
    secretName: devops-chatbot-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web

pvc:
  enabled: true
  name: devops-chatbot-data
  storageSize: 20Gi
  storageClass: longhorn
  accessMode: ReadWriteMany

pdb:
  enabled: true
  minAvailable: 1

resourceQuota:
  enabled: true
  hardLimitsCpu: "8"
  hardLimitsMemory: "16Gi"
  hardRequestsCpu: "4"
  hardRequestsMemory: "8Gi"
  persistentVolumeClaims: "2"
  requestsStorage: 20Gi
  pods: "10"
  services: "5"
  secrets: "10"
  configmaps: "10"

llm:
  # For GitOps flows, create the secret out-of-band (e.g. one-time kubectl or ExternalSecrets)
  # and keep createSecret=false so API keys are never committed to git.
  createSecret: false
  existingSecret: devops-chatbot-secrets
  apiKey: ""
  provider: "openrouter"
  model: "mistralai/devstral-2512"
  defaultRegion: "us-east-1"

# Defense-in-depth for agent Kubernetes API wrappers (in addition to user RBAC).
# Free-text remediation recommendations are always allowed; these gates control execution only.
# See specs/002-vestige-memory-mcp/contracts/access-model.md
kubeApi:
  allowRead: true
  # Mutating methods disabled by default (POST/PUT/PATCH/DELETE).
  allowMutate: false
  allowedMethods:
    - GET
  # Empty = no extra allowlist (deny.* and secrets.* still apply).
  allowedSubresources: []
  namespaceMode: any # any | allowlist | denylist
  namespaces: []
  allowedResources: []
  allowedApiGroups: []
  secrets:
    # Identify: LIST + metadata-only GET (name, type, labels, data key names).
    # Never return Secret data/stringData to the agent unless allowReadData is true.
    allowIdentify: true
    allowReadData: false
    allowMutate: false
  deny:
    serviceaccounts: true
    clusterScopedWrites: true
    execSubresource: true
    portforwardSubresource: true
    proxySubresource: true
  dryRunMutations: false
  logDeniedRequests: true

# Vestige MCP is colocated in the chatbot image (supervisord) and writes under
# the chatbot PVC at /data/vestige. Default URL is loopback only.
# Set backend to "noop" to skip memory (Vestige process still runs unless image is customized).
memory:
  backend: "vestige"
  vestigeHttpUrl: "http://127.0.0.1:3928"
  # Optional bearer for local Vestige; leave empty for loopback without auth.
  vestigeAuthSecret: ""
  dataDir: "/data/vestige"
  modelCacheDir: "/data/vestige/model-cache"

# Frontend and backend base-path configuration for subpath hosting
# These values are surfaced by backend /api/config and consumed by the browser.
# If these drift, the UI will call wrong endpoints and fail on click.
app:
  # Backend API base URL as seen by frontend (for API calls from browser)
  # Current image is root-built and calls /api directly.
  # Keep /api ingress passthrough enabled while using /devops-chat entry path.
  # Do NOT set this to /devops-chat/api unless the application router/ingress
  # is explicitly rewritten for that prefix.
  apiBaseUrl: "/api"
  # Frontend PUBLIC_URL for static assets and SPA routing
  # Current image serves static bundle from /static (root path).
  # Keep as "/" unless the frontend image is rebuilt for subpath assets.
  # If changed to /devops-chat without a matching frontend rebuild, static assets can 404.
  publicUrl: "/"
  # Comma-separated list of allowed CORS origins.
  # Keep aligned with ingress host to avoid browser CORS drift.
  allowedOrigins: "http://655d23be-a45d-49a6-a0e1-bd50ab91670c.k8s.civo.com,http://655d23be-a45d-49a6-a0e1-bd50ab91670c.k8s.civo.com/chatbot"
