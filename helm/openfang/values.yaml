image:
  repository: ghcr.io/rightnow-ai/openfang
  tag: "v0.5.6"
  pullPolicy: IfNotPresent

replicaCount: 1

# g4s.kube.medium nodes (2 vCPU / 3.7GB RAM).
# Rust binary: ~40MB idle, bursty during Hand execution and WASM JIT.
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

service:
  type: ClusterIP
  port: 4200

# SQLite DB, vector embeddings, Merkle audit chain, agent state.
pvc:
  name: openfang-data
  mountPath: /data
  size: 5Gi
  storageClass: longhorn

# LLM provider credentials — never committed, injected at deploy time.
llm:
  apiKey: ""
  provider: "openrouter"
  model: "mistralai/devstral-2512"

nameOverride: ""
fullnameOverride: ""
