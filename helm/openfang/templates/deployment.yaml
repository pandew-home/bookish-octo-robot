apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openfang.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openfang.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "openfang.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openfang.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openfang
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: api
              containerPort: 4200
              protocol: TCP
          env:
            - name: OPENFANG_HOME
              value: {{ .Values.pvc.mountPath | quote }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "openfang.fullname" . }}-secrets
                  key: llm-api-key
            - name: LLM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: {{ include "openfang.fullname" . }}-secrets
                  key: llm-provider
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: {{ include "openfang.fullname" . }}-secrets
                  key: llm-model
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.pvc.mountPath }}
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.name }}
