apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8sgpt-result-scraper
  namespace: monitoring
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 1800
      template:
        spec:
          serviceAccountName: alloy-k8sgpt
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          containers:
            - name: scraper
              image: alpine/k8s:1.29.2
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "100m"
                  memory: "128Mi"
              env:
                - name: LOKI_URL
                  value: "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  kubectl get results.core.k8sgpt.ai --all-namespaces -o json | \
                  python3 -c "
                  import sys, json, urllib.request, urllib.error, time, datetime, os

                  loki_url = os.environ['LOKI_URL']
                  data = json.load(sys.stdin)
                  streams = []

                  # Use current time as the Loki push timestamp so that every
                  # CronJob run (which may carry updated AI analysis in 'details')
                  # is always ingested — Loki deduplicates by stream+timestamp,
                  # so reusing creationTimestamp silently drops re-analysis updates.
                  now_ns = int(time.time() * 1e9)

                  for idx, item in enumerate(data['items']):
                      spec    = item['spec']
                      meta    = item['metadata']
                      created = meta.get('creationTimestamp', '')

                      # Parse parentObject (format: 'Kind/namespace/name' or just 'Kind')
                      # to get the actual namespace of the failing resource, not the CRD namespace.
                      parent = spec.get('parentObject', '')
                      parts  = parent.split('/')
                      if len(parts) >= 3:
                          resource_ns   = parts[1]
                          resource_name = parts[2]
                      else:
                          resource_ns   = 'default'
                          resource_name = spec.get('name', '')

                      # Unique nanosecond timestamp per entry within this run.
                      ts_ns = str(now_ns + idx * 1000)

                      error_text = ' | '.join(e.get('text', '') for e in spec.get('error', []))
                      details    = spec.get('details', '')

                      # Extract fix suggestion — LLM output may use several markers.
                      fix = ''
                      for marker in ('Solution:', 'Recommended action:', 'Recommendation:', 'Fix:'):
                          if marker in details:
                              fix = details[details.index(marker) + len(marker):].strip()
                              break

                      log_entry = {
                          'found_at':      created,
                          'kind':          spec.get('kind', ''),
                          'resource':      resource_name,
                          'resource_ns':   resource_ns,
                          'resource_path': parent or spec.get('name', ''),
                          'backend':       spec.get('backend', ''),
                          'error':         error_text,
                          'details':       details,
                          'fix':           fix,
                      }
                      streams.append({
                          'stream': {
                              'source':       'k8sgpt-result',
                              'kind':         spec.get('kind', 'unknown'),
                              'resource_ns':  resource_ns,
                          },
                          'values': [[ts_ns, json.dumps(log_entry)]]
                      })

                  if not streams:
                      print('No results found')
                      sys.exit(0)

                  payload = json.dumps({'streams': streams}).encode('utf-8')
                  req = urllib.request.Request(loki_url, data=payload,
                      headers={'Content-Type': 'application/json'}, method='POST')
                  try:
                      with urllib.request.urlopen(req) as resp:
                          print(f'Pushed {len(streams)} results to Loki (HTTP {resp.status})')
                  except urllib.error.HTTPError as e:
                      body = e.read().decode()
                      print(f'Loki push failed: {e.code} {body}', file=sys.stderr)
                      sys.exit(1)
                  "
