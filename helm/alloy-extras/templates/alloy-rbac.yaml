apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-k8sgpt
  namespace: monitoring
  labels:
    app: alloy
    component: k8sgpt-integration
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-k8sgpt-reader-cleaner
  labels:
    app: alloy
    component: k8sgpt-integration
rules:
  - apiGroups: ["core.k8sgpt.ai"]
    resources: ["results"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["core.k8sgpt.ai"]
    resources: ["k8sgpts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-k8sgpt-reader-cleaner
  labels:
    app: alloy
    component: k8sgpt-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-k8sgpt-reader-cleaner
subjects:
  - kind: ServiceAccount
    name: alloy-k8sgpt
    namespace: monitoring
