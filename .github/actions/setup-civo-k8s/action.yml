name: Setup Civo + kubectl
description: Install Civo CLI and configure kubectl for a cluster

inputs:
  civo_api_key:
    description: Civo API key
    required: true
  cluster_name:
    description: Civo cluster name
    required: true
  civo_region:
    description: Civo region (e.g. NYC1)
    required: true

runs:
  using: composite
  steps:
    - name: Install Civo CLI
      shell: bash
      run: curl -sL https://civo.com/get | sh

    - name: Configure kubectl
      shell: bash
      run: |
        set -euo pipefail
        # Write Civo config directly — avoids CLI apikey command compatibility issues
        mkdir -p ~/.config/civo
        printf '{"apikeys":{"deploy-key":"%s"},"meta":{"current_apikey":"deploy-key","url":"https://api.civo.com","current_region":"%s"}}' \
          "${{ inputs.civo_api_key }}" "${{ inputs.civo_region }}" > ~/.config/civo/settings.json
        civo kubernetes config "${{ inputs.cluster_name }}" --save
        chmod 700 ~/.kube || true
        chmod 600 ~/.kube/config || true
        kubectl get nodes
