name: Setup Civo + kubectl
description: Install Civo CLI and configure kubectl for a cluster

inputs:
  civo_api_key:
    description: Civo API key
    required: true
  cluster_name:
    description: Civo cluster name
    required: true
  civo_region:
    description: Civo region (e.g. NYC1)
    required: true

runs:
  using: composite
  steps:
    - name: Install Civo CLI
      shell: bash
      run: curl -sL https://civo.com/get | sh

    - name: Configure kubectl
      shell: bash
      run: |
        set -euo pipefail
        # Write Civo config directly — avoids CLI apikey command compatibility issues
        mkdir -p ~/.config/civo
        cat > ~/.config/civo/settings.json <<EOF
        {
          "apikeys": {
            "deploy-key": "${{ inputs.civo_api_key }}"
          },
          "meta": {
            "current_apikey": "deploy-key",
            "url": "https://api.civo.com",
            "current_region": "${{ inputs.civo_region }}"
          }
        }
        EOF
        civo kubernetes config "${{ inputs.cluster_name }}" --save
        chmod 700 ~/.kube || true
        chmod 600 ~/.kube/config || true
        kubectl get nodes
