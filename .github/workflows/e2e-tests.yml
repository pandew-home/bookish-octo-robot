name: E2E Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'k8s/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'k8s/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      cluster_failures:
        description: 'Include cluster failure tests'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        shard: [1, 2, 3]

    services:
      # Backend API for testing
      backend:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        ports:
          - 8000:8000
        env:
          ENVIRONMENT: test
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DEFAULT_REGION: us-east-1
        options: >-
          --health-cmd "curl -f http://localhost:8000/api/health/ready || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Test database (if needed)
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps

      - name: Setup test environment
        run: |
          # Create test configuration
          cat > frontend/.env.test << EOF
          REACT_APP_API_BASE_URL=http://localhost:8000
          REACT_APP_ENVIRONMENT=test
          REACT_APP_VERSION=${{ github.sha }}
          EOF

      - name: Wait for backend readiness
        run: |
          timeout 300 bash -c 'until curl -f http://localhost:8000/api/health/ready; do sleep 5; done'

      - name: Run Playwright tests
        id: e2e-tests
        run: |
          cd frontend
          npm run test:e2e -- \
            --shard=${{ matrix.shard }}/3 \
            --project=${{ matrix.browser }} \
            --reporter=github,html \
            ${{ github.event.inputs.cluster_failures == 'true' && '--grep="cluster.*failure|error.*scenario"' || '' }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-videos-${{ matrix.browser }}-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7

      - name: Generate test summary
        if: always()
        run: |
          cd frontend
          # Create a summary of test results
          echo "## E2E Test Results" > test-summary.md
          echo "- **Browser**: ${{ matrix.browser }}" >> test-summary.md
          echo "- **Shard**: ${{ matrix.shard }}/3" >> test-summary.md
          echo "- **Status**: ${{ steps.e2e-tests.outcome }}" >> test-summary.md
          echo "- **Commit**: ${{ github.sha }}" >> test-summary.md
          echo "- **Run ID**: ${{ github.run_id }}" >> test-summary.md

          # Add test statistics if available
          if [ -f "playwright-report/index.html" ]; then
            echo "- **Report**: Available" >> test-summary.md
          fi

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-summary-${{ matrix.browser }}-${{ matrix.shard }}
          path: frontend/test-summary.md

  merge-reports:
    name: Merge Test Reports
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()

    steps:
      - name: Download all test reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Merge HTML reports
        run: |
          # Install playwright-merge-reports if needed
          npm install -g @playwright/test

          # Merge all HTML reports
          npx playwright merge-reports all-reports/playwright-report-*/playwright-report

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: playwright-report/
          retention-days: 30

      - name: Create test metrics
        run: |
          # Extract test metrics from merged report
          if [ -f "playwright-report/index.html" ]; then
            # Simple metrics extraction (could be enhanced)
            echo "Tests completed - checking for failures..."

            # Check if there were any failures
            if find all-reports/ -name "*.json" -exec grep -l '"status":"failed"' {} \;; then
              echo "TESTS_FAILED=true" >> $GITHUB_ENV
            else
              echo "TESTS_FAILED=false" >> $GITHUB_ENV
            fi
          fi

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [e2e-tests, merge-reports]
    if: always()

    steps:
      - name: Send Slack notification
        if: failure() && github.ref == 'refs/heads/main'
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "🚨 E2E Tests Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*E2E Tests Failed on main branch*\n\n• Repository: ${{ github.repository }}\n• Commit: ${{ github.sha }}\n• Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n• Branch: ${{ github.ref_name }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Discord notification
        if: success() && github.ref == 'refs/heads/main'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "✅ E2E Tests Passed"
          description: |
            All E2E tests passed successfully on main branch
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
          color: 0x00ff00

  deploy-on-success:
    name: Deploy on Test Success
    runs-on: ubuntu-latest
    needs: [e2e-tests, merge-reports]
    if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger ArgoCD sync
        run: |
          # Trigger ArgoCD application sync
          curl -X POST ${{ secrets.ARGOCD_SERVER_URL }}/api/webhook \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
            -d '{
              "application": "devops-chatbot",
              "revision": "${{ github.sha }}",
              "triggeredBy": "GitHub Actions E2E Tests"
            }'

      - name: Update deployment status
        run: |
          # Update GitOps repository with test results
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Clone gitops repo (assuming separate repo)
          git clone https://${{ secrets.GITOPS_TOKEN }}@github.com/${{ secrets.GITOPS_REPO }}.git gitops
          cd gitops

          # Update test status
          mkdir -p test-results/${{ github.sha }}
          echo '{
            "status": "passed",
            "timestamp": "'$(date -Iseconds)'",
            "commit": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "browser_coverage": ["chromium", "firefox"],
            "environment": "production"
          }' > test-results/${{ github.sha }}/e2e-results.json

          git add .
          git commit -m "Update E2E test results for ${{ github.sha }}"
          git push origin main