name: GitOps Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'k8s/**'
      - 'docker/**'
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip E2E tests'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.build-backend.outputs.image }}
      frontend-image: ${{ steps.build-frontend.outputs.image }}
      test-results: ${{ steps.test-results.outputs.results }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run unit tests
        run: |
          # Backend tests
          cd backend
          pip install -r requirements.txt
          python -m pytest --cov=. --cov-report=xml

          # Frontend tests
          cd ../frontend
          npm run test -- --coverage --watchAll=false

      - name: Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml,./frontend/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Run E2E tests
        if: github.event.inputs.skip_tests != 'true'
        run: |
          # Start test environment
          docker run -d --name test-backend \
            -e ENVIRONMENT=test \
            -e LLM_API_KEY=${{ secrets.LLM_API_KEY }} \
            -p 8000:8000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}

          # Wait for backend
          timeout 300 bash -c 'until curl -f http://localhost:8000/api/health/ready; do sleep 5; done'

          # Run E2E tests
          cd frontend
          npm run test:e2e -- --project=chromium --reporter=github,json

      - name: Set test results
        id: test-results
        run: |
          if [ -f "frontend/test-results.json" ]; then
            echo "results=passed" >> $GITHUB_OUTPUT
          else
            echo "results=failed" >> $GITHUB_OUTPUT
          fi

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-test
    if: (success() && github.ref == 'refs/heads/main') || github.event.inputs.environment == 'staging'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update GitOps repository
        run: |
          # Clone gitops repo
          git clone https://${{ secrets.GITOPS_TOKEN }}@github.com/${{ secrets.GITOPS_REPO }}.git gitops
          cd gitops

          # Update staging manifests
          sed -i 's|image: .*/backend:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}|' k8s/staging/backend-deployment.yaml
          sed -i 's|image: .*/frontend:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}|' k8s/staging/frontend-deployment.yaml

          # Update test status
          mkdir -p test-results/staging/${{ github.sha }}
          echo '{
            "status": "deployed",
            "environment": "staging",
            "timestamp": "'$(date -Iseconds)'",
            "commit": "${{ github.sha }}",
            "images": {
              "backend": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}",
              "frontend": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}"
            },
            "test_results": "${{ needs.build-and-test.outputs.test-results }}"
          }' > test-results/staging/${{ github.sha }}/deployment.json

          git add .
          git commit -m "Deploy ${{ github.sha }} to staging"
          git push origin main

      - name: Trigger ArgoCD sync
        run: |
          curl -X POST ${{ secrets.ARGOCD_SERVER_URL }}/api/webhook \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
            -d '{
              "application": "devops-chatbot-staging",
              "revision": "${{ github.sha }}",
              "triggeredBy": "GitHub Actions GitOps Deployment",
              "environment": "staging"
            }'

      - name: Run post-deployment tests
        run: |
          # Wait for deployment
          sleep 120

          # Run smoke tests against staging
          cd frontend
          BASE_URL=https://staging.devops-chatbot.example.com npm run test:e2e -- --grep="smoke" --project=chromium

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-staging]
    if: success() && github.ref == 'refs/heads/main' && github.event.inputs.environment == 'production'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for staging validation
        run: |
          # Wait for staging to be healthy
          timeout 600 bash -c '
            until curl -f https://staging.devops-chatbot.example.com/api/health; do
              echo "Waiting for staging to be healthy..."
              sleep 30
            done
          '

      - name: Update GitOps repository
        run: |
          # Clone gitops repo
          git clone https://${{ secrets.GITOPS_TOKEN }}@github.com/${{ secrets.GITOPS_REPO }}.git gitops
          cd gitops

          # Update production manifests
          sed -i 's|image: .*/backend:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}|' k8s/production/backend-deployment.yaml
          sed -i 's|image: .*/frontend:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}|' k8s/production/frontend-deployment.yaml

          # Update test status
          mkdir -p test-results/production/${{ github.sha }}
          echo '{
            "status": "deployed",
            "environment": "production",
            "timestamp": "'$(date -Iseconds)'",
            "commit": "${{ github.sha }}",
            "images": {
              "backend": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}",
              "frontend": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}"
            },
            "test_results": "${{ needs.build-and-test.outputs.test-results }}",
            "staging_validation": "passed"
          }' > test-results/production/${{ github.sha }}/deployment.json

          git add .
          git commit -m "Deploy ${{ github.sha }} to production"
          git push origin main

      - name: Trigger ArgoCD sync
        run: |
          curl -X POST ${{ secrets.ARGOCD_SERVER_URL }}/api/webhook \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
            -d '{
              "application": "devops-chatbot-production",
              "revision": "${{ github.sha }}",
              "triggeredBy": "GitHub Actions GitOps Deployment",
              "environment": "production"
            }'

      - name: Run production smoke tests
        run: |
          # Wait for deployment
          sleep 180

          # Run smoke tests against production
          cd frontend
          BASE_URL=https://devops-chatbot.example.com npm run test:e2e -- --grep="smoke" --project=chromium

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: failure() && (needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure')

    steps:
      - name: Trigger rollback
        run: |
          echo "Deployment failed - triggering rollback"
          # Implement rollback logic here
          # Could trigger ArgoCD to rollback to previous version

      - name: Notify failure
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "🚨 Deployment Failed - Rollback Triggered",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Failed and Rolled Back*\n\n• Repository: ${{ github.repository }}\n• Commit: ${{ github.sha }}\n• Environment: ${{ github.event.inputs.environment || 'staging' }}\n• Action: Automatic rollback initiated"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}