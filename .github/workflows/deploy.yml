name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'helm/**'
      - 'k8s/**'
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      direct_deploy:
        description: 'Enable direct kubectl/helm deploy jobs (deprecated after Flux migration)'
        required: false
        default: false
        type: boolean
      deploy_only:
        description: 'Skip build and test jobs and run deployment steps only'
        required: false
        default: false
        type: boolean
      skip_deploy:
        description: 'Build only, skip deploy'
        required: false
        default: false
        type: boolean
      image_tag:
        description: 'Existing image tag to deploy without rebuilding'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CLUSTER_NAME: bookish-octo-robot
  CIVO_REGION: NYC1
  NAMESPACE: devops-chatbot
  OPERATOR_NAMESPACE: k8sgpt-operator-system
  # Grafana access mode: "ingress-subpath" uses Traefik ingress at /grafana
  # Other options: "nodeport" (direct NodePort), "proxy" (kubectl port-forward)
  GRAFANA_ACCESS_MODE: ingress-subpath
  # Grafana host for Traefik ingress routing (set for ingress-subpath mode)
  GRAFANA_HOST: 17198d1a-3422-49ec-ad09-67ced6a5a0d6.k8s.civo.com
  GRAFANA_SUBPATH: /grafana

permissions:
  contents: read
  packages: write

jobs:
  detect:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.changes.outputs.backend_changed }}
      frontend_changed: ${{ steps.changes.outputs.frontend_changed }}
      libs_changed: ${{ steps.changes.outputs.libs_changed }}
      helm_changed: ${{ steps.changes.outputs.helm_changed }}
      k8s_changed: ${{ steps.changes.outputs.k8s_changed }}
      docker_changed: ${{ steps.changes.outputs.docker_changed }}
      auth_changed: ${{ steps.changes.outputs.auth_changed }}
      chat_changed: ${{ steps.changes.outputs.chat_changed }}
      operator_changed: ${{ steps.changes.outputs.operator_changed }}
      app_image_changed: ${{ steps.changes.outputs.app_image_changed }}
      app_deploy_changed: ${{ steps.changes.outputs.app_deploy_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          git fetch --no-tags --prune origin "$DEFAULT_BRANCH"

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            DIFF_BASE="$EVENT_BEFORE"
          else
            DIFF_BASE="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi

          git diff --name-only "$DIFF_BASE" HEAD > /tmp/changed-files.txt

          echo "Changed files since $DIFF_BASE:"
          cat /tmp/changed-files.txt || true

          has_match() {
            local pattern="$1"
            if grep -Eq "$pattern" /tmp/changed-files.txt; then
              echo true
            else
              echo false
            fi
          }

          backend_changed="$(has_match '^backend/')"
          frontend_changed="$(has_match '^frontend/')"
          libs_changed="$(has_match '^libs/')"
          helm_changed="$(has_match '^helm/')"
          k8s_changed="$(has_match '^k8s/')"
          docker_changed="$(has_match '^(Dockerfile$|docker/)')"
          auth_changed="$(has_match '^(backend/api/credentials.py|backend/credential_store.py|backend/middleware/|backend/eks_auth.py|backend/local_k8s_auth.py|backend/tests/test_credentials_api.py|backend/tests/test_auth_flows.py|backend/tests/test_cluster_isolation.py)')"
          chat_changed="$(has_match '^(backend/api/chat.py|backend/enrichment_engine.py|backend/agentic_engine.py|backend/query_router.py|backend/tests/test_chat_api.py)')"
          operator_changed="$(has_match '^(k8sgpt/|\.github/workflows/deploy-k8sgpt.yml$)')"

          if [ "$backend_changed" = "true" ] || [ "$frontend_changed" = "true" ] || [ "$libs_changed" = "true" ] || [ "$docker_changed" = "true" ]; then
            app_image_changed=true
          else
            app_image_changed=false
          fi

          if [ "$app_image_changed" = "true" ] || [ "$helm_changed" = "true" ] || [ "$k8s_changed" = "true" ]; then
            app_deploy_changed=true
          else
            app_deploy_changed=false
          fi

          {
            echo "backend_changed=$backend_changed"
            echo "frontend_changed=$frontend_changed"
            echo "libs_changed=$libs_changed"
            echo "helm_changed=$helm_changed"
            echo "k8s_changed=$k8s_changed"
            echo "docker_changed=$docker_changed"
            echo "auth_changed=$auth_changed"
            echo "chat_changed=$chat_changed"
            echo "operator_changed=$operator_changed"
            echo "app_image_changed=$app_image_changed"
            echo "app_deploy_changed=$app_deploy_changed"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: detect
    outputs:
      image_tag: ${{ github.sha }}
      image_exists: ${{ steps.image-check.outputs.exists }}

    steps:
      - name: Skip build for deploy-only run
        if: github.event.inputs.deploy_only == 'true'
        run: echo "Deploy-only run requested; skipping image build."

      - name: Checkout
        if: github.event.inputs.deploy_only != 'true'
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event.inputs.deploy_only != 'true' && github.event.inputs.image_tag == ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip build for manual image tag
        if: github.event.inputs.deploy_only != 'true' && github.event.inputs.image_tag != ''
        id: manual-image
        run: |
          echo "Using manually supplied image tag: ${{ github.event.inputs.image_tag }}"
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Check for existing image tag
        id: image-check
        if: github.event.inputs.deploy_only != 'true' && github.event.inputs.image_tag == ''
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing existing image: $IMAGE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist yet: $IMAGE"
          fi

      - name: Set up Docker Buildx
        if: github.event.inputs.deploy_only != 'true' && github.event.inputs.image_tag == '' && needs.detect.outputs.app_image_changed == 'true' && steps.image-check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: github.event.inputs.deploy_only != 'true' && github.event.inputs.image_tag == '' && needs.detect.outputs.app_image_changed == 'true' && steps.image-check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Report image selection
        run: |
          if [ "${{ github.event.inputs.deploy_only }}" = "true" ]; then
            echo "Deploy-only run requested; no image build performed"
          elif [ "${{ github.event.inputs.image_tag }}" != "" ]; then
            echo "Using manually supplied image tag ${{ github.event.inputs.image_tag }}"
          elif [ "${{ needs.detect.outputs.app_image_changed }}" != "true" ]; then
            echo "No image-affecting changes detected; build skipped"
          elif [ "${{ steps.image-check.outputs.exists }}" = "true" ]; then
            echo "Using previously published image for ${{ github.sha }}"
          else
            echo "Built and pushed new image for ${{ github.sha }}"
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [detect, build]

    steps:
      - name: Skip tests for deploy-only run
        if: github.event.inputs.deploy_only == 'true'
        run: echo "Deploy-only run requested; skipping tests."

      - name: Checkout
        if: github.event.inputs.deploy_only != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        if: github.event.inputs.deploy_only != 'true' && needs.detect.outputs.backend_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        if: github.event.inputs.deploy_only != 'true' && needs.detect.outputs.backend_changed == 'true'
        run: |
          pip install -r backend/requirements.txt
          pip install "httpx<0.28"

      - name: Run critical security & auth tests
        if: github.event.inputs.deploy_only != 'true' && needs.detect.outputs.auth_changed == 'true'
        run: |
          cd backend
          python -m pytest tests/test_credentials_api.py tests/test_auth_flows.py tests/test_cluster_isolation.py -v --tb=short --no-cov

      - name: Run chat API & integration tests
        if: github.event.inputs.deploy_only != 'true' && needs.detect.outputs.chat_changed == 'true'
        run: |
          cd backend
          python -m pytest tests/test_chat_api.py -v --tb=short --no-cov

      - name: Run all backend tests
        if: github.event.inputs.deploy_only != 'true' && needs.detect.outputs.backend_changed == 'true'
        run: |
          cd backend
          python -m pytest --tb=short -q --no-cov

      - name: Setup Python for operator libs
        if: github.event.inputs.deploy_only != 'true' && needs.detect.outputs.libs_changed == 'true' && needs.detect.outputs.backend_changed != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install operator lib deps
        if: github.event.inputs.deploy_only != 'true' && needs.detect.outputs.libs_changed == 'true' && needs.detect.outputs.backend_changed != 'true'
        run: pip install -r backend/requirements.txt "httpx<0.28"

      - name: Run operator lib tests
        if: github.event.inputs.deploy_only != 'true' && needs.detect.outputs.libs_changed == 'true'
        run: |
          pip install -e libs/devops-k8s -e libs/devops-kb -e libs/devops-rag
          python -m pytest libs/devops-k8s/tests libs/devops-kb/tests libs/devops-rag/tests \
            -v --tb=short -q --no-cov

      - name: Setup Node.js
        if: github.event.inputs.deploy_only != 'true' && needs.detect.outputs.frontend_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        if: github.event.inputs.deploy_only != 'true' && needs.detect.outputs.frontend_changed == 'true'
        run: |
          cd frontend
          npm install
          npm test -- --watchAll=false

      - name: Setup Helm for chart tests
        if: github.event.inputs.deploy_only != 'true'
        uses: azure/setup-helm@v5
        with:
          version: '3.20.2'

      - name: Run Helm chart tests
        if: github.event.inputs.deploy_only != 'true' && needs.detect.outputs.app_deploy_changed == 'true'
        run: |
          pip install pytest pyyaml --quiet
          python -m pytest tests/test_helm_chart.py -v --tb=short

      - name: Set up Docker Buildx
        if: github.event.inputs.deploy_only != 'true' && needs.detect.outputs.app_image_changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event.inputs.deploy_only != 'true' && needs.detect.outputs.app_image_changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image Smoke Test
        if: github.event.inputs.deploy_only != 'true' && needs.detect.outputs.app_image_changed == 'true'
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE" || { echo "Failed to pull image"; exit 1; }

          # Start container
          echo "Starting container..."
          docker run -d \
            --name chatbot-test \
            -p 8080:8080 \
            -e LLM_API_KEY=smoke-test-key \
            -e DEFAULT_REGION=us-east-1 \
            -e LLM_PROVIDER=openai \
            -e LLM_MODEL=gpt-4o-mini \
            --health-cmd="curl -f http://localhost:8080/api/health || exit 1" \
            --health-interval=5s \
            --health-timeout=3s \
            --health-retries=3 \
            "$IMAGE"

          # Poll the health endpoint until the container is ready (max 60s)
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8080/api/health >/dev/null 2>&1; then
              echo "Backend healthy after $((i * 5))s"
              break
            fi
            if ! docker ps --filter name=chatbot-test --filter status=running -q | grep -q .; then
              echo "Container exited before becoming healthy"
              docker logs chatbot-test
              exit 1
            fi
            echo "Waiting... attempt $i/12"
            sleep 5
          done

          # Final check container is still running
          if ! docker ps | grep chatbot-test; then
            echo "Container crashed!"
            docker logs chatbot-test
            exit 1
          fi

          echo "=== Testing Frontend ==="
          curl -sf http://localhost:8080/ > /tmp/frontend.html && echo "✓ Frontend loaded" || { echo "✗ Frontend failed"; cat /tmp/frontend.html; exit 1; }

          echo "=== Testing Backend Health ==="
          curl -sf http://localhost:8080/api/health > /tmp/health.json && echo "✓ Health check passed" || { echo "✗ Health check failed"; cat /tmp/health.json; exit 1; }

          echo "=== Testing API Endpoint ==="
          curl -sf -H "X-Session-ID: test-session" http://localhost:8080/api/clusters > /tmp/clusters.json 2>&1 && echo "✓ API endpoint accessible" || echo "Note: API requires valid session (expected)"

          echo ""
          echo "=== Container logs (last 30 lines) ==="
          docker logs chatbot-test | tail -30

          docker stop chatbot-test || true
          docker rm chatbot-test || true

          echo "✓ All smoke tests passed!"

  deploy-k8sgpt-operator:
    name: Deploy K8sGPT Operator
    needs: [detect, test]
    if: success() && github.event.inputs.direct_deploy == 'true' && github.event.inputs.skip_deploy != 'true' && github.event.inputs.deploy_only != 'true' && needs.detect.outputs.operator_changed == 'true'
    uses: ./.github/workflows/k8sgpt-deploy-shared.yml
    with:
      cluster_name: bookish-octo-robot
      civo_region: NYC1
      operator_namespace: k8sgpt-operator-system
      grafana_access_mode: ingress-subpath
      grafana_host: 17198d1a-3422-49ec-ad09-67ced6a5a0d6.k8s.civo.com
      grafana_subpath: /grafana
    secrets:
      civo_api_key: ${{ secrets.CIVO_API_KEY }}
      openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}

  deploy:
    name: Deploy to bookish-octo
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: [detect, build, test]
    if: success() && github.event.inputs.direct_deploy == 'true' && github.event.inputs.skip_deploy != 'true' && (needs.detect.outputs.app_deploy_changed == 'true' || github.event.inputs.image_tag != '')
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: '3.20.2'

      - name: Helm Validate
        run: |
          set -euo pipefail
          helm lint --strict helm/devops-chatbot/
          helm template helm/devops-chatbot/ --set image.tag=lint-check > /dev/null

      - name: Setup Civo + kubectl
        uses: ./.github/actions/setup-civo-k8s
        with:
          civo_api_key: ${{ secrets.CIVO_API_KEY }}
          cluster_name: ${{ env.CLUSTER_NAME }}
          civo_region: ${{ env.CIVO_REGION }}

      - name: Create namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create secrets
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PULL_TOKEN }} \
            -n ${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic devops-chatbot-secrets \
            --from-literal=llm-api-key=${{ secrets.OPENROUTER_API_KEY }} \
            --from-literal=llm-provider=openrouter \
            --from-literal=llm-model=mistralai/devstral-2512 \
            -n ${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy cert-manager ClusterIssuers
        run: |
          kubectl apply -f k8s/cert-issuer.yaml || echo "cert-manager not installed - HTTPS will not be available"

      - name: Apply Kyverno policies
        run: kubectl apply -f k8s/kyverno-policies.yaml || true

      - name: Resolve image tag for deploy
        id: resolve-image
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
            echo "Using manually requested image tag: $TAG"
          elif [ "${{ needs.detect.outputs.app_image_changed }}" = "true" ]; then
            TAG="${{ github.sha }}"
            echo "Using image built for current commit: $TAG"
          else
            CURRENT_IMAGE=$(kubectl get deployment -n ${{ env.NAMESPACE }} devops-chatbot -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            CURRENT_TAG="${CURRENT_IMAGE##*:}"

            if [ -z "$CURRENT_IMAGE" ] || [ "$CURRENT_TAG" = "$CURRENT_IMAGE" ]; then
              echo "Unable to infer existing deployed image tag. Provide workflow_dispatch input image_tag to deploy config-only changes."
              exit 1
            fi

            TAG="$CURRENT_TAG"
            echo "Reusing currently deployed image tag for config-only deploy: $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Unlock stuck Helm release
        run: |
          set -euo pipefail
          RELEASE_STATUS=$(helm status devops-chatbot --namespace ${{ env.NAMESPACE }} -o json 2>/dev/null \
            | jq -r '.info.status // empty' || true)
          if [[ "$RELEASE_STATUS" == pending* ]]; then
            echo "Release is stuck in '$RELEASE_STATUS' state. Clearing lock..."
            LAST_DEPLOYED=$(helm history devops-chatbot --namespace ${{ env.NAMESPACE }} -o json 2>/dev/null \
              | jq -r '[.[] | select(.status == "deployed")] | last | .revision // empty' || true)
            if [ -n "$LAST_DEPLOYED" ]; then
              echo "Rolling back to last deployed revision $LAST_DEPLOYED..."
              helm rollback devops-chatbot "$LAST_DEPLOYED" --namespace ${{ env.NAMESPACE }} || true
            else
              echo "No deployed revision found. Deleting pending Helm secrets..."
              kubectl get secrets -n ${{ env.NAMESPACE }} \
                -l "owner=helm,name=devops-chatbot" \
                -o jsonpath='{range .items[*]}{.metadata.name} {.metadata.labels.status}{"\n"}{end}' \
                | awk '/pending/ {print $1}' \
                | xargs -r kubectl delete secret -n ${{ env.NAMESPACE }} || true
            fi
          else
            echo "Release status: ${RELEASE_STATUS:-not found}. No unlock needed."
          fi

      - name: Reset stuck Helm release
        run: |
          set -euo pipefail
          # If a previous run was interrupted it leaves the release in pending-upgrade/pending-install
          # state. Every subsequent upgrade attempt fails with "another operation is in progress"
          # until the lock is cleared. Roll back to the last successfully deployed revision, or
          # uninstall entirely if no deployed revision exists.
          STATUS=$(helm status devops-chatbot -n ${{ env.NAMESPACE }} -o json 2>/dev/null \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['status'])" 2>/dev/null \
            || echo "none")
          echo "Current Helm release status: $STATUS"
          if [[ "$STATUS" == pending-* ]]; then
            echo "Release is stuck in '$STATUS', resetting..."
            LAST_OK=$(helm history devops-chatbot -n ${{ env.NAMESPACE }} -o json 2>/dev/null \
              | python3 -c "import sys,json; h=[r for r in json.load(sys.stdin) if r['status']=='deployed']; print(h[-1]['revision'] if h else '')" \
              2>/dev/null || echo "")
            if [[ -n "$LAST_OK" ]]; then
              echo "Rolling back to last deployed revision $LAST_OK"
              helm rollback devops-chatbot "$LAST_OK" -n ${{ env.NAMESPACE }} --wait 2>/dev/null || true
            else
              echo "No previously deployed revision found, uninstalling"
              helm uninstall devops-chatbot -n ${{ env.NAMESPACE }} 2>/dev/null || true
            fi
            sleep 5
          fi

      - name: Deploy application (Helm)
        run: |
          set -euo pipefail

          clear_pending_lock() {
            local status
            status=$(helm status devops-chatbot -n ${{ env.NAMESPACE }} -o json 2>/dev/null \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('info',{}).get('status',''))" 2>/dev/null \
              || true)
            if [[ "$status" == pending-* ]]; then
              echo "Helm release still locked ($status); clearing pending revision secret(s)..."
              helm history devops-chatbot -n ${{ env.NAMESPACE }} -o json 2>/dev/null \
                | python3 -c "import sys,json; h=json.load(sys.stdin); [print(r['revision']) for r in h if str(r.get('status','')).startswith('pending-')]" \
                | while read -r rev; do
                    [ -n "$rev" ] || continue
                    kubectl delete secret "sh.helm.release.v1.devops-chatbot.v${rev}" -n ${{ env.NAMESPACE }} --ignore-not-found=true || true
                  done
            fi
          }

          wait_for_cluster() {
            local max_attempts=${1:-6}
            local sleep_seconds=${2:-10}
            for i in $(seq 1 "$max_attempts"); do
              if kubectl version --request-timeout=20s >/dev/null 2>&1; then
                echo "Kubernetes API reachable"
                return 0
              fi
              echo "Kubernetes API not reachable (attempt ${i}/${max_attempts}); refreshing kubeconfig"
              civo kubernetes config ${{ env.CLUSTER_NAME }} --save || true
              chmod 700 ~/.kube || true
              chmod 600 ~/.kube/config || true
              sleep "$sleep_seconds"
            done
            return 1
          }

          for attempt in 1 2 3; do
            echo "Helm deploy attempt ${attempt}/3"

            if ! wait_for_cluster 6 10; then
              echo "Cluster API remained unreachable before app deploy attempt ${attempt}"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 15))
                continue
              fi
              echo "Helm deploy failed after retries"
              exit 1
            fi

            clear_pending_lock

            if HELM_BURST_LIMIT=200 helm upgrade --install devops-chatbot helm/devops-chatbot/ \
              --namespace ${{ env.NAMESPACE }} \
              --create-namespace \
              --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
              --set image.tag=${{ steps.resolve-image.outputs.tag }} \
              --set podLabels.gitSha=${{ steps.resolve-image.outputs.tag }} \
              --set llm.apiKey=${{ secrets.OPENROUTER_API_KEY }} \
              --set llm.provider=openrouter \
              --set llm.model=mistralai/devstral-2512 \
              --set llm.defaultRegion=us-east-1 \
              --set ingress.path=/ \
              --set app.apiBaseUrl=/ \
              --set app.publicUrl=/ \
              --set app.allowedOrigins="http://$(civo kubernetes show ${{ env.CLUSTER_NAME }} -o custom -f DNSEntry 2>/dev/null || echo localhost)" \
              --atomic \
              --wait \
              --timeout=600s; then
              echo "Helm deploy succeeded"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Helm deploy failed, refreshing kubeconfig before retry"
              civo kubernetes config ${{ env.CLUSTER_NAME }} --save || true
              chmod 700 ~/.kube || true
              chmod 600 ~/.kube/config || true
              kubectl version --request-timeout=20s || true
              sleep $((attempt * 10))
            fi
          done

          echo "Helm deploy failed after retries"
          exit 1

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get svc -n ${{ env.NAMESPACE }}

      - name: Post-deploy health check
        run: |
          POD=$(kubectl get pod -n ${{ env.NAMESPACE }} -l app=devops-chatbot -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n ${{ env.NAMESPACE }} $POD -- curl -sf http://localhost:8080/api/health || echo "Health check pending (pod may still be starting)"

      - name: Helm release history
        if: always()
        run: helm history devops-chatbot -n ${{ env.NAMESPACE }} || true

  smoke-test:
    name: Post-Deploy Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event.inputs.direct_deploy == 'true' && needs.deploy.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Civo + kubectl
        uses: ./.github/actions/setup-civo-k8s
        with:
          civo_api_key: ${{ secrets.CIVO_API_KEY }}
          cluster_name: ${{ env.CLUSTER_NAME }}
          civo_region: ${{ env.CIVO_REGION }}

      - name: Setup Python for smoke tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Port-forward and run health checks
        run: |
          kubectl port-forward -n ${{ env.NAMESPACE }} svc/devops-chatbot 8080:80 &
          PF_PID=$!
          sleep 5

          # Health endpoints
          echo "=== Liveness ==="
          curl -sf http://localhost:8080/api/health | jq .

          echo "=== Readiness ==="
          curl -sf http://localhost:8080/api/health/ready | jq .

          kill $PF_PID

      - name: Run critical unit tests
        run: |
          pip install -r backend/requirements.txt
          pip install -e libs/devops-k8s -e libs/devops-kb -e libs/devops-rag
          pip install "httpx<0.28"
          cd backend
          echo "=== Running critical security and auth tests ==="
          python -m pytest tests/test_credentials_api.py tests/test_auth_flows.py -v --tb=short || echo "Note: Some tests may require cluster credentials, checking logs..."

      - name: Resolve smoke test endpoint
        id: smoke-endpoint
        run: |
          set -euo pipefail

          HOST=$(kubectl get ingress -n ${{ env.NAMESPACE }} devops-chatbot -o jsonpath='{.spec.rules[0].host}' 2>/dev/null || true)
          BASE_URL=""

          if [ -n "$HOST" ]; then
            # Try both schemes and both base paths (root and legacy /devops-chatbot).
            CANDIDATES=(
              "https://${HOST}"
              "https://${HOST}/devops-chatbot"
              "http://${HOST}"
              "http://${HOST}/devops-chatbot"
            )

            echo "=== Probing public endpoint candidates ==="
            for candidate in "${CANDIDATES[@]}"; do
              echo "Checking ${candidate}/api/health"
              if curl -sf --retry 6 --retry-delay 5 --retry-connrefused "${candidate}/api/health" >/dev/null; then
                BASE_URL="$candidate"
                break
              fi
            done
          fi

          if [ -n "$BASE_URL" ]; then
            echo "Using public smoke endpoint: $BASE_URL"
            echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
            echo "used_public=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Public endpoint not reachable yet; falling back to in-cluster service via port-forward."
          kubectl port-forward -n ${{ env.NAMESPACE }} svc/devops-chatbot 18080:80 >/tmp/smoke-port-forward.log 2>&1 &
          PF_PID=$!
          sleep 5
          if ! curl -sf http://127.0.0.1:18080/api/health >/dev/null; then
            echo "✗ Fallback port-forward endpoint is also unreachable"
            cat /tmp/smoke-port-forward.log || true
            kill $PF_PID >/dev/null 2>&1 || true
            exit 1
          fi
          kill $PF_PID >/dev/null 2>&1 || true

          echo "base_url=http://127.0.0.1:18080" >> "$GITHUB_OUTPUT"
          echo "used_public=false" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests against resolved endpoint
        run: |
          set -euo pipefail
          BASE_URL="${{ steps.smoke-endpoint.outputs.base_url }}"

          if [ "${{ steps.smoke-endpoint.outputs.used_public }}" = "false" ]; then
            kubectl port-forward -n ${{ env.NAMESPACE }} svc/devops-chatbot 18080:80 >/tmp/smoke-port-forward.log 2>&1 &
            PF_PID=$!
            trap 'kill $PF_PID >/dev/null 2>&1 || true' EXIT
            sleep 5
          fi

          echo "=== Running functional smoke tests against $BASE_URL ==="
          python backend/tests/smoke_post_deploy.py "$BASE_URL"

      - name: Verify K8s resources
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide

          echo "=== Events (last 10min) ==="
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' | tail -20

          echo "=== Pod logs (last 50 lines) ==="
          kubectl logs -n ${{ env.NAMESPACE }} deployment/devops-chatbot --tail=50
