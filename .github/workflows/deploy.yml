name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'libs/**'
      - 'k8s/**'
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Build only, skip deploy'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CLUSTER_NAME: bookish-octo-robot
  NAMESPACE: devops-chatbot

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Backend tests
        run: |
          pip install -r backend/requirements.txt
          pip install -e libs/devops-k8s -e libs/devops-kb -e libs/devops-prompts -e libs/devops-rag
          pip install "httpx<0.28"
          cd backend

      - name: Run critical security & auth tests
        run: |
          cd backend
          python -m pytest tests/test_credentials_api.py tests/test_auth_flows.py tests/test_cluster_isolation.py -v --tb=short --no-cov

      - name: Run chat API & integration tests
        run: |
          cd backend
          python -m pytest tests/test_chat_api.py tests/test_enrichment_timeout.py -v --tb=short --no-cov

      - name: Run all backend tests
        run: |
          cd backend
          python -m pytest --tb=short -q --no-cov

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        run: |
          cd frontend
          npm install
          npm test -- --watchAll=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image Smoke Test
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE" || { echo "Failed to pull image"; exit 1; }

          # Start container
          echo "Starting container..."
          docker run -d \
            --name chatbot-test \
            -p 8080:8080 \
            -e LLM_API_KEY=smoke-test-key \
            -e DEFAULT_REGION=us-east-1 \
            -e LLM_PROVIDER=openai \
            -e LLM_MODEL=gpt-4o-mini \
            --health-cmd="curl -f http://localhost:8080/api/health || exit 1" \
            --health-interval=5s \
            --health-timeout=3s \
            --health-retries=3 \
            "$IMAGE"

          # Wait for backend to start (startup validator + uvicorn init)
          echo "Waiting for services to start..."
          sleep 30

          # Check container is still running
          if ! docker ps | grep chatbot-test; then
            echo "Container crashed!"
            docker logs chatbot-test
            exit 1
          fi

          echo "=== Testing Frontend ==="
          curl -sf http://localhost:8080/ > /tmp/frontend.html && echo "✓ Frontend loaded" || { echo "✗ Frontend failed"; cat /tmp/frontend.html; exit 1; }

          echo "=== Testing Backend Health ==="
          curl -sf http://localhost:8080/api/health > /tmp/health.json && echo "✓ Health check passed" || { echo "✗ Health check failed"; cat /tmp/health.json; exit 1; }

          echo "=== Testing API Endpoint ==="
          curl -sf -H "X-Session-ID: test-session" http://localhost:8080/api/clusters > /tmp/clusters.json 2>&1 && echo "✓ API endpoint accessible" || echo "Note: API requires valid session (expected)"

          echo ""
          echo "=== Container logs (last 30 lines) ==="
          docker logs chatbot-test | tail -30

          docker stop chatbot-test || true
          docker rm chatbot-test || true

          echo "✓ All smoke tests passed!"

  deploy:
    name: Deploy to bookish-octo
    runs-on: ubuntu-latest
    needs: [build, test]
    if: success() && github.event.inputs.skip_deploy != 'true'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Civo CLI
        run: |
          curl -sL https://civo.com/get | sh
          civo version

      - name: Configure Civo + kubectl
        run: |
          civo apikey save deploy-key ${{ secrets.CIVO_API_KEY }}
          civo apikey current deploy-key
          civo kubernetes config ${{ env.CLUSTER_NAME }} --save

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Update image tag in manifests
        run: |
          sed -i "s|image: .*ghcr.io/.*/bookish-octo-robot:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}|" k8s/deployment.yaml
          sed -i "s|git-sha: .*|git-sha: \"${{ needs.build.outputs.image_tag }}\"|g" k8s/deployment.yaml

      # --- Pre-requisites ---
      - name: Create namespaces
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8sgpt/namespace.yaml

      - name: Create secrets
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PULL_TOKEN }} \
            -n ${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic devops-chatbot-secrets \
            --from-literal=llm-api-key=${{ secrets.OPENROUTER_API_KEY }} \
            --from-literal=llm-provider=openrouter \
            --from-literal=llm-model=mistralai/devstral-2512 \
            -n ${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic k8sgpt-ai-secret \
            --from-literal=openai-api-key=${{ secrets.OPENROUTER_API_KEY }} \
            -n k8sgpt-operator-system \
            --dry-run=client -o yaml | kubectl apply -f -

      # --- K8sGPT Operator ---
      - name: Deploy K8sGPT operator
        run: |
          helm repo add k8sgpt-operator https://charts.k8sgpt.ai/
          helm repo update
          helm upgrade --install k8sgpt-operator k8sgpt-operator/k8sgpt-operator \
            -n k8sgpt-operator-system --wait --timeout=120s
          kubectl apply -f k8sgpt/rbac.yaml
          kubectl apply -f k8sgpt/k8sgpt-openrouter-cr.yaml

      # --- HTTPS/TLS Setup ---
      - name: Deploy cert-manager ClusterIssuers
        run: |
          # Wait for cert-manager to be ready (should be pre-installed on Civo)
          echo "Deploying Let's Encrypt certificate issuers..."
          kubectl apply -f k8s/cert-issuer.yaml || echo "cert-manager not installed - HTTPS will not be available"

      # --- Application ---
      - name: Deploy application
        run: |
          kubectl apply -f k8s/serviceaccount.yaml
          kubectl apply -f k8s/pvc.yaml
          kubectl apply -f k8s/deployment.yaml
           kubectl apply -f k8s/service.yaml
           kubectl apply -f k8s/ingress.yaml
           kubectl apply -f k8s/pdb.yaml
          kubectl apply -f k8s/resourcequota.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/devops-chatbot \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get svc -n ${{ env.NAMESPACE }}

      - name: Post-deploy health check
        run: |
          POD=$(kubectl get pod -n ${{ env.NAMESPACE }} -l app=devops-chatbot -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n ${{ env.NAMESPACE }} $POD -- curl -sf http://localhost:8080/api/health || echo "Health check pending (pod may still be starting)"

  smoke-test:
    name: Post-Deploy Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Civo CLI
        run: |
          curl -sL https://civo.com/get | sh

      - name: Configure Civo + kubectl
        run: |
          civo apikey save deploy-key ${{ secrets.CIVO_API_KEY }}
          civo apikey current deploy-key
          civo kubernetes config ${{ env.CLUSTER_NAME }} --save

      - name: Setup Python for smoke tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Port-forward and run health checks
        run: |
          kubectl port-forward -n ${{ env.NAMESPACE }} svc/devops-chatbot 8080:80 &
          PF_PID=$!
          sleep 5

          # Health endpoints
          echo "=== Liveness ==="
          curl -sf http://localhost:8080/api/health | jq .

          echo "=== Readiness ==="
          curl -sf http://localhost:8080/api/health/ready | jq .

          kill $PF_PID

      - name: Run critical unit tests
        run: |
          pip install -r backend/requirements.txt
          pip install -e libs/devops-k8s -e libs/devops-kb -e libs/devops-prompts -e libs/devops-rag
          pip install "httpx<0.28"
          cd backend
          echo "=== Running critical security and auth tests ==="
          python -m pytest tests/test_credentials_api.py tests/test_auth_flows.py -v --tb=short || echo "Note: Some tests may require cluster credentials, checking logs..."

      - name: Wait for public endpoint to stabilise
        run: |
          URL="http://5f361a88-3ba6-486a-990a-f146df27e219.k8s.civo.com"

          echo "=== Public health check (with retries) ==="
          curl -sf --retry 10 --retry-delay 5 --retry-connrefused \
            "$URL/api/health" | jq . || { echo "✗ Public health endpoint unreachable"; exit 1; }

          echo "=== Public frontend check ==="
          curl -sf --retry 5 --retry-delay 3 \
            "$URL/" -o /dev/null -w "HTTP %{http_code}\n" || { echo "✗ Public frontend unreachable"; exit 1; }

          echo "✓ Public endpoint is up"

      - name: Run real endpoint smoke tests
        run: |
          URL="http://5f361a88-3ba6-486a-990a-f146df27e219.k8s.civo.com"
          echo "=== Running functional smoke tests against $URL ==="
          python backend/tests/smoke_post_deploy.py "$URL"

      - name: Verify K8s resources
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide

          echo "=== Events (last 10min) ==="
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' | tail -20

          echo "=== Pod logs (last 50 lines) ==="
          kubectl logs -n ${{ env.NAMESPACE }} deployment/devops-chatbot --tail=50
