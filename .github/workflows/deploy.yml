name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'helm/**'
      - 'k8s/**'
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Build only, skip deploy'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CLUSTER_NAME: bookish-octo-robot
  NAMESPACE: devops-chatbot
  OPERATOR_NAMESPACE: k8sgpt-operator-system

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Dockerfile'
              - 'docker/**'
            frontend:
              - 'frontend/**'
            auth:
              - 'backend/api/credentials.py'
              - 'backend/credential_store.py'
              - 'backend/middleware/**'
              - 'backend/eks_auth.py'
              - 'backend/local_k8s_auth.py'
              - 'backend/tests/test_credentials_api.py'
              - 'backend/tests/test_auth_flows.py'
              - 'backend/tests/test_cluster_isolation.py'
            chat:
              - 'backend/api/chat.py'
              - 'backend/enrichment_engine.py'
              - 'backend/agentic_engine.py'
              - 'backend/query_router.py'
              - 'backend/tests/test_chat_api.py'
            operator:
              - 'libs/**'

      - name: Setup Python
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        if: steps.changes.outputs.backend == 'true'
        run: |
          pip install -r backend/requirements.txt
          pip install "httpx<0.28"

      - name: Run critical security & auth tests
        if: steps.changes.outputs.auth == 'true'
        run: |
          cd backend
          python -m pytest tests/test_credentials_api.py tests/test_auth_flows.py tests/test_cluster_isolation.py -v --tb=short --no-cov

      - name: Run chat API & integration tests
        if: steps.changes.outputs.chat == 'true'
        run: |
          cd backend
          python -m pytest tests/test_chat_api.py -v --tb=short --no-cov

      - name: Run all backend tests
        if: steps.changes.outputs.backend == 'true'
        run: |
          cd backend
          python -m pytest --tb=short -q --no-cov

      - name: Setup Python for operator libs
        if: steps.changes.outputs.operator == 'true' && steps.changes.outputs.backend != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install operator lib deps
        if: steps.changes.outputs.operator == 'true' && steps.changes.outputs.backend != 'true'
        run: pip install -r backend/requirements.txt "httpx<0.28"

      - name: Run operator lib tests
        if: steps.changes.outputs.operator == 'true'
        run: |
          pip install -e libs/devops-k8s -e libs/devops-kb -e libs/devops-prompts -e libs/devops-rag
          python -m pytest libs/devops-k8s/tests libs/devops-kb/tests libs/devops-prompts/tests libs/devops-rag/tests \
            -v --tb=short -q --no-cov

      - name: Setup Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        if: steps.changes.outputs.frontend == 'true'
        run: |
          cd frontend
          npm install
          npm test -- --watchAll=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image Smoke Test
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE" || { echo "Failed to pull image"; exit 1; }

          # Start container
          echo "Starting container..."
          docker run -d \
            --name chatbot-test \
            -p 8080:8080 \
            -e LLM_API_KEY=smoke-test-key \
            -e DEFAULT_REGION=us-east-1 \
            -e LLM_PROVIDER=openai \
            -e LLM_MODEL=gpt-4o-mini \
            --health-cmd="curl -f http://localhost:8080/api/health || exit 1" \
            --health-interval=5s \
            --health-timeout=3s \
            --health-retries=3 \
            "$IMAGE"

          # Wait for backend to start (startup validator + uvicorn init)
          echo "Waiting for services to start..."
          sleep 30

          # Check container is still running
          if ! docker ps | grep chatbot-test; then
            echo "Container crashed!"
            docker logs chatbot-test
            exit 1
          fi

          echo "=== Testing Frontend ==="
          curl -sf http://localhost:8080/ > /tmp/frontend.html && echo "✓ Frontend loaded" || { echo "✗ Frontend failed"; cat /tmp/frontend.html; exit 1; }

          echo "=== Testing Backend Health ==="
          curl -sf http://localhost:8080/api/health > /tmp/health.json && echo "✓ Health check passed" || { echo "✗ Health check failed"; cat /tmp/health.json; exit 1; }

          echo "=== Testing API Endpoint ==="
          curl -sf -H "X-Session-ID: test-session" http://localhost:8080/api/clusters > /tmp/clusters.json 2>&1 && echo "✓ API endpoint accessible" || echo "Note: API requires valid session (expected)"

          echo ""
          echo "=== Container logs (last 30 lines) ==="
          docker logs chatbot-test | tail -30

          docker stop chatbot-test || true
          docker rm chatbot-test || true

          echo "✓ All smoke tests passed!"

  deploy-k8sgpt-operator:
    name: Deploy K8sGPT Operator
    runs-on: ubuntu-latest
    needs: [build, test]
    if: success() && github.event.inputs.skip_deploy != 'true'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Install Civo CLI
        run: |
          curl -sL https://civo.com/get | sh
          civo version

      - name: Configure Civo + kubectl
        run: |
          civo apikey save deploy-key ${{ secrets.CIVO_API_KEY }}
          civo apikey current deploy-key
          civo kubernetes config ${{ env.CLUSTER_NAME }} --save

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Add Helm repos
        run: |
          helm repo add k8sgpt-operator https://charts.k8sgpt.ai/
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Create operator namespace
        run: kubectl create namespace ${{ env.OPERATOR_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create k8sgpt AI secret
        run: |
          kubectl create secret generic k8sgpt-ai-secret \
            --from-literal=openai-api-key=${{ secrets.OPENROUTER_API_KEY }} \
            -n ${{ env.OPERATOR_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy K8sGPT operator (Helm)
        run: |
          helm upgrade --install k8sgpt-operator k8sgpt-operator/k8sgpt-operator \
            -n ${{ env.OPERATOR_NAMESPACE }} \
            --version 0.2.27 \
            --values k8sgpt/helm-values.yaml \
            --wait \
            --timeout=120s

      - name: Apply custom RBAC and K8sGPT CR
        run: |
          kubectl apply -f k8sgpt/rbac.yaml
          kubectl apply -f k8sgpt/k8sgpt-openrouter-cr.yaml

      - name: Wait for K8sGPT CR ready
        run: |
          kubectl wait k8sgpt/k8sgpt-openrouter \
            -n ${{ env.OPERATOR_NAMESPACE }} \
            --for=condition=Ready \
            --timeout=120s \
          || kubectl describe k8sgpt/k8sgpt-openrouter -n ${{ env.OPERATOR_NAMESPACE }}

      - name: Deploy Alloy and observability manifests
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8sgpt/Alloy/alloy-rbac.yaml
          helm upgrade --install alloy grafana/alloy \
            -n monitoring --create-namespace \
            --values k8sgpt/Alloy/alloy-values.yaml \
            --wait --timeout=120s
          kubectl apply -f k8sgpt/Alloy/alloy-cleanup-cronjob.yaml
          kubectl apply -f k8sgpt/Alloy/k8sgpt-result-scraper.yaml

      - name: Apply monitoring stack Helm overrides
        run: |
          if helm status kube-prometheus-stack -n monitoring > /dev/null 2>&1; then
            helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
              -n monitoring --create-namespace --reuse-values \
              --values k8sgpt/Alloy/kube-prometheus-stack-values.yaml
          else
            helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
              -n monitoring --create-namespace \
              --values k8sgpt/Alloy/kube-prometheus-stack-values.yaml
          fi
          # Loki already deployed in loki namespace - skip upgrade

      - name: Register Loki datasource in Grafana via API
        run: |
          if kubectl get svc -n monitoring prometheus-grafana >/dev/null 2>&1; then
            GRAFANA_SERVICE=prometheus-grafana
            GRAFANA_SECRET=prometheus-grafana
          elif kubectl get svc -n monitoring kube-prometheus-stack-grafana >/dev/null 2>&1; then
            GRAFANA_SERVICE=kube-prometheus-stack-grafana
            GRAFANA_SECRET=kube-prometheus-stack-grafana
          else
            echo "Grafana service not found in monitoring namespace"
            kubectl get svc -n monitoring || true
            exit 1
          fi

          GRAFANA_PASS=$(kubectl get secret "$GRAFANA_SECRET" -n monitoring \
            -o jsonpath='{.data.admin-password}' | base64 -d)
          GRAFANA_URL="http://127.0.0.1:8001/api/v1/namespaces/monitoring/services/http:${GRAFANA_SERVICE}:80/proxy"

          kubectl proxy --port=8001 >/tmp/kubectl-proxy.log 2>&1 &
          PROXY_PID=$!
          trap 'kill $PROXY_PID >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 12); do
            if curl -sf -u "admin:${GRAFANA_PASS}" "${GRAFANA_URL}/api/health" > /dev/null 2>&1; then
              break
            fi
            echo "Waiting for Grafana... attempt $i"
            sleep 5
          done

          curl -sf -u "admin:${GRAFANA_PASS}" "${GRAFANA_URL}/api/health" > /dev/null \
            || { echo "Grafana health probe failed"; cat /tmp/kubectl-proxy.log || true; exit 1; }

          curl -s -X POST \
            -H "Content-Type: application/json" \
            -u "admin:${GRAFANA_PASS}" \
            -d '{"name":"Loki","type":"loki","uid":"loki","access":"proxy","url":"http://loki.loki.svc.cluster.local:3100","isDefault":false,"jsonData":{"maxLines":1000}}' \
            "${GRAFANA_URL}/api/datasources" \
            || curl -s -X PUT \
              -H "Content-Type: application/json" \
              -u "admin:${GRAFANA_PASS}" \
              -d '{"name":"Loki","type":"loki","uid":"loki","access":"proxy","url":"http://loki.loki.svc.cluster.local:3100","isDefault":false,"jsonData":{"maxLines":1000}}' \
              "${GRAFANA_URL}/api/datasources/uid/loki" \
            || echo "Loki datasource registration skipped"
          echo "Loki datasource step completed"

      - name: Push dashboard to Grafana via API
        run: |
          if kubectl get svc -n monitoring prometheus-grafana >/dev/null 2>&1; then
            GRAFANA_SERVICE=prometheus-grafana
            GRAFANA_SECRET=prometheus-grafana
          elif kubectl get svc -n monitoring kube-prometheus-stack-grafana >/dev/null 2>&1; then
            GRAFANA_SERVICE=kube-prometheus-stack-grafana
            GRAFANA_SECRET=kube-prometheus-stack-grafana
          else
            echo "Grafana service not found in monitoring namespace"
            kubectl get svc -n monitoring || true
            exit 1
          fi

          GRAFANA_PASS=$(kubectl get secret "$GRAFANA_SECRET" -n monitoring \
            -o jsonpath='{.data.admin-password}' | base64 -d)
          GRAFANA_URL="http://127.0.0.1:8001/api/v1/namespaces/monitoring/services/http:${GRAFANA_SERVICE}:80/proxy"

          kubectl proxy --port=8001 >/tmp/kubectl-proxy.log 2>&1 &
          PROXY_PID=$!
          trap 'kill $PROXY_PID >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 12); do
            curl -sf -u "admin:${GRAFANA_PASS}" "${GRAFANA_URL}/api/health" && break
            echo "Waiting for Grafana... attempt $i"
            sleep 10
          done

          curl -sf -u "admin:${GRAFANA_PASS}" "${GRAFANA_URL}/api/health" > /dev/null \
            || { echo "Grafana health probe failed"; cat /tmp/kubectl-proxy.log || true; exit 1; }

          python3 scripts/build_grafana_dashboard.py

          RESULT=$(curl -sf -X POST \
            -H "Content-Type: application/json" \
            -u "admin:${GRAFANA_PASS}" \
            -d @/tmp/grafana-payload.json \
            "${GRAFANA_URL}/api/dashboards/db")
          echo "Dashboard import: ${RESULT}"
          echo "URL: ${GRAFANA_URL}/d/k8sgpt-findings-v2"

      - name: Verify operator and observability deployment
        run: |
          kubectl get pods -n ${{ env.OPERATOR_NAMESPACE }}
          kubectl get pods -n monitoring
          kubectl get cronjob -n monitoring | grep alloy-cleanup || true

  deploy:
    name: Deploy to bookish-octo
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: [build, test, deploy-k8sgpt-operator]
    if: success() && github.event.inputs.skip_deploy != 'true'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Helm Validate
        run: |
          helm lint --strict helm/devops-chatbot/
          helm template helm/devops-chatbot/ --set image.tag=lint-check > /dev/null

      - name: Install Civo CLI
        run: |
          curl -sL https://civo.com/get | sh
          civo version

      - name: Configure Civo + kubectl
        run: |
          civo apikey save deploy-key ${{ secrets.CIVO_API_KEY }}
          civo apikey current deploy-key
          civo kubernetes config ${{ env.CLUSTER_NAME }} --save

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Create namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create secrets
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PULL_TOKEN }} \
            -n ${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy cert-manager ClusterIssuers
        run: |
          kubectl apply -f k8s/cert-issuer.yaml || echo "cert-manager not installed - HTTPS will not be available"

      - name: Apply Kyverno policies
        run: kubectl apply -f k8s/kyverno-policies.yaml || true

      - name: Deploy application (Helm)
        run: |
          helm upgrade --install devops-chatbot helm/devops-chatbot/ \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ needs.build.outputs.image_tag }} \
            --set podLabels.gitSha=${{ needs.build.outputs.image_tag }} \
            --set llm.apiKey=${{ secrets.OPENROUTER_API_KEY }} \
            --set llm.provider=openrouter \
            --set llm.model=mistralai/devstral-2512 \
            --set llm.defaultRegion=us-east-1 \
            --atomic \
            --wait \
            --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get svc -n ${{ env.NAMESPACE }}

      - name: Post-deploy health check
        run: |
          POD=$(kubectl get pod -n ${{ env.NAMESPACE }} -l app=devops-chatbot -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n ${{ env.NAMESPACE }} $POD -- curl -sf http://localhost:8080/api/health || echo "Health check pending (pod may still be starting)"

      - name: Helm release history
        if: always()
        run: helm history devops-chatbot -n ${{ env.NAMESPACE }} || true

  smoke-test:
    name: Post-Deploy Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Civo CLI
        run: |
          curl -sL https://civo.com/get | sh

      - name: Configure Civo + kubectl
        run: |
          civo apikey save deploy-key ${{ secrets.CIVO_API_KEY }}
          civo apikey current deploy-key
          civo kubernetes config ${{ env.CLUSTER_NAME }} --save

      - name: Setup Python for smoke tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Port-forward and run health checks
        run: |
          kubectl port-forward -n ${{ env.NAMESPACE }} svc/devops-chatbot 8080:80 &
          PF_PID=$!
          sleep 5

          # Health endpoints
          echo "=== Liveness ==="
          curl -sf http://localhost:8080/api/health | jq .

          echo "=== Readiness ==="
          curl -sf http://localhost:8080/api/health/ready | jq .

          kill $PF_PID

      - name: Run critical unit tests
        run: |
          pip install -r backend/requirements.txt
          pip install -e libs/devops-k8s -e libs/devops-kb -e libs/devops-prompts -e libs/devops-rag
          pip install "httpx<0.28"
          cd backend
          echo "=== Running critical security and auth tests ==="
          python -m pytest tests/test_credentials_api.py tests/test_auth_flows.py -v --tb=short || echo "Note: Some tests may require cluster credentials, checking logs..."

      - name: Wait for public endpoint to stabilise
        run: |
          HOST=$(kubectl get ingress -n ${{ env.NAMESPACE }} devops-chatbot -o jsonpath='{.spec.rules[0].host}')
          if [ -z "$HOST" ]; then
            echo "✗ Ingress host not found"
            exit 1
          fi
          URL="http://${HOST}"

          echo "=== Public health check (with retries) ==="
          curl -sf --retry 10 --retry-delay 5 --retry-connrefused \
            "$URL/devops-chatbot/api/health" | jq . || { echo "✗ Public health endpoint unreachable"; exit 1; }

          echo "=== Public frontend check ==="
          curl -sf --retry 5 --retry-delay 3 \
            "$URL/devops-chatbot/" -o /dev/null -w "HTTP %{http_code}\n" || { echo "✗ Public frontend unreachable"; exit 1; }

          echo "✓ Public endpoint is up"

      - name: Run real endpoint smoke tests
        run: |
          HOST=$(kubectl get ingress -n ${{ env.NAMESPACE }} devops-chatbot -o jsonpath='{.spec.rules[0].host}')
          if [ -z "$HOST" ]; then
            echo "✗ Ingress host not found"
            exit 1
          fi
          URL="http://${HOST}"
          echo "=== Running functional smoke tests against $URL/devops-chatbot ==="
          python backend/tests/smoke_post_deploy.py "$URL/devops-chatbot"

      - name: Verify K8s resources
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide

          echo "=== Events (last 10min) ==="
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' | tail -20

          echo "=== Pod logs (last 50 lines) ==="
          kubectl logs -n ${{ env.NAMESPACE }} deployment/devops-chatbot --tail=50
