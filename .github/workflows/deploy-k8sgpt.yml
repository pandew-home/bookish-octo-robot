name: Deploy K8sGPT Operator & Observability

on:
  push:
    branches: [main]
    paths:
      - 'k8sgpt/**'
      - '.github/workflows/deploy-k8sgpt.yml'
  workflow_dispatch:

env:
  CLUSTER_NAME: bookish-octo-robot

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy K8sGPT & Observability
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Civo CLI
        run: curl -sL https://civo.com/get | sh

      - name: Configure kubectl
        run: |
          civo apikey save deploy-key ${{ secrets.CIVO_API_KEY }}
          civo apikey current deploy-key
          civo kubernetes config ${{ env.CLUSTER_NAME }} --save

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Add Helm repos
        run: |
          helm repo add k8sgpt-operator https://charts.k8sgpt.ai/
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Create namespace
        run: kubectl apply -f k8sgpt/namespace.yaml

      - name: Create k8sgpt AI secret
        run: |
          kubectl create secret generic k8sgpt-ai-secret \
            --from-literal=openai-api-key=${{ secrets.OPENROUTER_API_KEY }} \
            -n k8sgpt-operator-system \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy K8sGPT operator
        run: |
          helm upgrade --install k8sgpt-operator k8sgpt-operator/k8sgpt-operator \
            -n k8sgpt-operator-system \
            --version 0.1.4 \
            --values k8sgpt/helm-values.yaml \
            --wait --timeout=120s

      - name: Apply custom RBAC
        run: kubectl apply -f k8sgpt/rbac.yaml

      - name: Apply K8sGPT CR
        run: kubectl apply -f k8sgpt/k8sgpt-openrouter-cr.yaml

      - name: Wait for K8sGPT CR ready
        run: |
          kubectl wait k8sgpt/k8sgpt-openrouter \
            -n k8sgpt-operator-system \
            --for=condition=Ready \
            --timeout=120s \
          || kubectl describe k8sgpt/k8sgpt-openrouter -n k8sgpt-operator-system

      - name: Deploy Alloy & observability manifests
        run: |
          kubectl apply -f k8sgpt/Alloy/alloy-rbac.yaml
          helm upgrade --install alloy grafana/alloy \
            -n monitoring --create-namespace \
            --values k8sgpt/Alloy/alloy-values.yaml \
            --wait --timeout=120s
          kubectl apply -f k8sgpt/Alloy/alloy-cleanup-cronjob.yaml
          kubectl apply -f k8sgpt/Alloy/k8sgpt-result-scraper.yaml

      - name: Apply monitoring stack Helm overrides
        run: |
          helm upgrade kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            -n monitoring --reuse-values \
            --values k8sgpt/Alloy/kube-prometheus-stack-values.yaml
          helm upgrade loki grafana/loki-stack \
            -n monitoring --reuse-values \
            --values k8sgpt/Alloy/loki-stack-values.yaml

      - name: Register Loki datasource in Grafana via API
        run: |
          GRAFANA_IP=$(kubectl get svc prometheus-grafana -n monitoring \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          GRAFANA_URL="http://${GRAFANA_IP}"
          GRAFANA_PASS=$(kubectl get secret prometheus-grafana -n monitoring \
            -o jsonpath='{.data.admin-password}' | base64 -d)

          # Wait for Grafana to be reachable
          for i in $(seq 1 12); do
            curl -sf -u "admin:${GRAFANA_PASS}" "${GRAFANA_URL}/api/health" && break
            echo "Waiting for Grafana... attempt $i"
            sleep 10
          done

          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -u "admin:${GRAFANA_PASS}" \
            -d '{"name":"Loki","type":"loki","uid":"loki","access":"proxy","url":"http://loki.loki.svc.cluster.local:3100","isDefault":false,"jsonData":{"maxLines":1000}}' \
            "${GRAFANA_URL}/api/datasources" \
          || curl -sf -X PUT \
            -H "Content-Type: application/json" \
            -u "admin:${GRAFANA_PASS}" \
            -d '{"name":"Loki","type":"loki","uid":"loki","access":"proxy","url":"http://loki.loki.svc.cluster.local:3100","isDefault":false,"jsonData":{"maxLines":1000}}' \
            "${GRAFANA_URL}/api/datasources/uid/loki"
          echo "Loki datasource registered"

      - name: Push dashboard to Grafana via API
        run: |
          # Get Grafana external IP and admin password
          GRAFANA_IP=$(kubectl get svc prometheus-grafana -n monitoring \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          GRAFANA_URL="http://${GRAFANA_IP}"
          GRAFANA_PASS=$(kubectl get secret prometheus-grafana -n monitoring \
            -o jsonpath='{.data.admin-password}' | base64 -d)

          # Wait for Grafana to be reachable
          for i in $(seq 1 12); do
            curl -sf -u "admin:${GRAFANA_PASS}" "${GRAFANA_URL}/api/health" && break
            echo "Waiting for Grafana... attempt $i"
            sleep 10
          done

          # Build and push K8sGPT Findings & Fixes dashboard
          python3 - <<'EOF'
import json

dashboard = {
    "title": "K8sGPT Findings & Fixes",
    "uid": "k8sgpt-findings-v2",
    "tags": ["k8sgpt"],
    "schemaVersion": 38,
    "version": 1,
    "refresh": "5m",
    "time": {"from": "now-7d", "to": "now"},
    "panels": [
        {
            "id": 1, "type": "stat", "title": "Total Active Findings",
            "gridPos": {"h": 4, "w": 4, "x": 0, "y": 0},
            "datasource": {"type": "loki", "uid": "loki"},
            "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": 0}, {"color": "yellow", "value": 5}, {"color": "red", "value": 10}]}}},
            "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
            "targets": [{"datasource": {"type": "loki", "uid": "loki"}, "expr": 'count(count_over_time({source="k8sgpt-result"}[7d]))', "instant": True, "refId": "A"}]
        },
        {
            "id": 2, "type": "piechart", "title": "Findings by Kind",
            "gridPos": {"h": 8, "w": 8, "x": 4, "y": 0},
            "datasource": {"type": "loki", "uid": "loki"},
            "options": {"pieType": "pie", "displayLabels": ["name", "value"]},
            "targets": [{"datasource": {"type": "loki", "uid": "loki"}, "expr": 'count by (kind) (count_over_time({source="k8sgpt-result"}[7d]))', "instant": True, "legendFormat": "{{kind}}", "refId": "A"}]
        },
        {
            "id": 4, "type": "logs", "title": "K8sGPT Findings \u2014 Error & [FIX] Highlighted",
            "gridPos": {"h": 20, "w": 24, "x": 0, "y": 8},
            "datasource": {"type": "loki", "uid": "loki"},
            "options": {"dedupStrategy": "none", "enableLogDetails": True, "prettifyLogMessage": True, "showLabels": False, "showTime": True, "sortOrder": "Descending", "wrapLogMessage": True},
            "targets": [{"datasource": {"type": "loki", "uid": "loki"}, "expr": '{source="k8sgpt-result"} | json | line_format "\ud83d\udd34 {{.kind}} \u2014 {{.resource}}\\n\u274c ERROR: {{.error}}\\n\u2705 FIX: {{.fix}}\\n\ud83d\udd50 Found: {{.found_at}}"', "refId": "A"}]
        },
        {
            "id": 5, "type": "table", "title": "Findings Table (sortable)",
            "gridPos": {"h": 18, "w": 24, "x": 0, "y": 28},
            "datasource": {"type": "loki", "uid": "loki"},
            "options": {"frameIndex": 0, "showHeader": True, "sortBy": [{"displayName": "found_at", "desc": True}]},
            "fieldConfig": {"overrides": [
                {"matcher": {"id": "byName", "options": "fix"}, "properties": [{"id": "custom.width", "value": 500}, {"id": "custom.displayMode", "value": "color-background"}, {"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-green"}}]},
                {"matcher": {"id": "byName", "options": "error"}, "properties": [{"id": "custom.width", "value": 400}, {"id": "custom.displayMode", "value": "color-background"}, {"id": "color", "value": {"mode": "fixed", "fixedColor": "dark-red"}}]},
                {"matcher": {"id": "byName", "options": "kind"}, "properties": [{"id": "custom.width", "value": 90}]},
                {"matcher": {"id": "byName", "options": "resource"}, "properties": [{"id": "custom.width", "value": 250}]},
                {"matcher": {"id": "byName", "options": "found_at"}, "properties": [{"id": "custom.width", "value": 160}]},
                {"matcher": {"id": "byName", "options": "Time"}, "properties": [{"id": "custom.hidden", "value": True}]},
                {"matcher": {"id": "byName", "options": "source"}, "properties": [{"id": "custom.hidden", "value": True}]},
                {"matcher": {"id": "byName", "options": "namespace"}, "properties": [{"id": "custom.hidden", "value": True}]},
            ]},
            "targets": [{"datasource": {"type": "loki", "uid": "loki"}, "expr": '{source="k8sgpt-result"} | json found_at="found_at", kind="kind", resource="resource", error="error", fix="fix", backend="backend"', "instant": False, "refId": "A"}]
        }
    ]
}

payload = json.dumps({"dashboard": dashboard, "overwrite": True, "folderId": 0})
with open('/tmp/grafana-payload.json', 'w') as f:
    f.write(payload)
print("Dashboard payload ready")
EOF

          RESULT=$(curl -sf -X POST \
            -H "Content-Type: application/json" \
            -u "admin:${GRAFANA_PASS}" \
            -d @/tmp/grafana-payload.json \
            "${GRAFANA_URL}/api/dashboards/db")
          echo "Dashboard import: ${RESULT}"
          echo "URL: ${GRAFANA_URL}/d/k8sgpt-findings-v2"

      - name: Verify deployment
        run: |
          kubectl get pods -n k8sgpt-operator-system
          kubectl get pods -n monitoring
          kubectl get k8sgpts -n k8sgpt-operator-system
