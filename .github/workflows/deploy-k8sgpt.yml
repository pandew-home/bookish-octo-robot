name: Deploy K8sGPT Operator & Observability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/k8sgpt-deploy-shared.yml
    with:
      cluster_name: bookish-octo-robot
      civo_region: NYC1
      operator_namespace: k8sgpt-operator-system
      grafana_access_mode: ingress-subpath
      grafana_host: 17198d1a-3422-49ec-ad09-67ced6a5a0d6.k8s.civo.com
      grafana_subpath: /grafana
    secrets:
      civo_api_key: ${{ secrets.CIVO_API_KEY }}
      openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
