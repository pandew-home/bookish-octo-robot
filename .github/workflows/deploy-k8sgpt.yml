name: Deploy K8sGPT Operator & Observability

on:
  push:
    branches: [main]
    paths:
      - 'k8sgpt/**'
      - '.github/workflows/deploy-k8sgpt.yml'
  workflow_dispatch:

env:
  CLUSTER_NAME: bookish-octo-robot
  # Grafana access mode: "ingress-subpath" uses Traefik ingress at /grafana
  # Other options: "nodeport" (direct NodePort), "proxy" (kubectl port-forward)
  GRAFANA_ACCESS_MODE: ingress-subpath
  # Grafana host for Traefik ingress routing (set for ingress-subpath mode)
  GRAFANA_HOST: 17198d1a-3422-49ec-ad09-67ced6a5a0d6.k8s.civo.com
  GRAFANA_SUBPATH: /grafana

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy K8sGPT & Observability
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Civo CLI
        run: curl -sL https://civo.com/get | sh

      - name: Configure kubectl
        run: |
          civo apikey save deploy-key ${{ secrets.CIVO_API_KEY }}
          civo apikey current deploy-key
          civo kubernetes config ${{ env.CLUSTER_NAME }} --save

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Add Helm repos
        run: |
          helm repo add k8sgpt-operator https://charts.k8sgpt.ai/
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Create namespace
        run: kubectl apply -f k8sgpt/namespace.yaml

      - name: Create k8sgpt AI secret
        run: |
          kubectl create secret generic k8sgpt-ai-secret \
            --from-literal=openai-api-key=${{ secrets.OPENROUTER_API_KEY }} \
            -n k8sgpt-operator-system \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy K8sGPT operator
        run: |
          helm upgrade --install k8sgpt-operator k8sgpt-operator/k8sgpt-operator \
            -n k8sgpt-operator-system \
            --version 0.2.27 \
            --values k8sgpt/helm-values.yaml \
            --wait --timeout=120s

      - name: Apply custom RBAC
        run: kubectl apply -f k8sgpt/rbac.yaml

      - name: Apply K8sGPT CR
        run: kubectl apply -f k8sgpt/k8sgpt-openrouter-cr.yaml

      - name: Wait for K8sGPT CR ready
        run: |
          kubectl wait k8sgpt/k8sgpt-openrouter \
            -n k8sgpt-operator-system \
            --for=condition=Ready \
            --timeout=120s \
          || kubectl describe k8sgpt/k8sgpt-openrouter -n k8sgpt-operator-system

      - name: Deploy Alloy & observability manifests
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8sgpt/Alloy/alloy-rbac.yaml
          helm upgrade --install alloy grafana/alloy \
            -n monitoring --create-namespace \
            --values k8sgpt/Alloy/alloy-values.yaml \
            --wait --timeout=120s
          kubectl apply -f k8sgpt/Alloy/alloy-cleanup-cronjob.yaml
          kubectl apply -f k8sgpt/Alloy/k8sgpt-result-scraper.yaml

      - name: Apply monitoring stack Helm overrides
        run: |
          if helm status kube-prometheus-stack -n monitoring > /dev/null 2>&1; then
            helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
              -n monitoring --create-namespace --reuse-values \
              --values k8sgpt/Alloy/kube-prometheus-stack-values-base.yaml \
              --values k8sgpt/Alloy/kube-prometheus-stack-values-civo-traefik.yaml
          else
            helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
              -n monitoring --create-namespace \
              --values k8sgpt/Alloy/kube-prometheus-stack-values-base.yaml \
              --values k8sgpt/Alloy/kube-prometheus-stack-values-civo-traefik.yaml
          fi
          # Loki already deployed in loki namespace - skip upgrade

      - name: Register Loki datasource in Grafana via API
        run: |
          PROXY_PID=""

          if kubectl get svc -n monitoring kube-prometheus-stack-grafana >/dev/null 2>&1; then
            GRAFANA_SERVICE=kube-prometheus-stack-grafana
            GRAFANA_SECRET=kube-prometheus-stack-grafana
          elif kubectl get svc -n monitoring prometheus-grafana >/dev/null 2>&1; then
            GRAFANA_SERVICE=prometheus-grafana
            GRAFANA_SECRET=prometheus-grafana
          else
            echo "Grafana service not found in monitoring namespace"
            kubectl get svc -n monitoring || true
            exit 1
          fi

          # Resolve working Grafana credentials from secrets.
          GRAFANA_USER=""
          GRAFANA_PASS=""

          try_secret_creds() {
            local secret_name="$1"
            local user pass

            user=$(kubectl get secret "$secret_name" -n monitoring -o jsonpath='{.data.admin-user}' 2>/dev/null | base64 -d 2>/dev/null || true)
            pass=$(kubectl get secret "$secret_name" -n monitoring -o jsonpath='{.data.admin-password}' 2>/dev/null | base64 -d 2>/dev/null || true)

            if [ -z "$user" ]; then
              user="admin"
            fi

            if [ -z "$pass" ]; then
              return 1
            fi

            GRAFANA_USER="$user"
            GRAFANA_PASS="$pass"
            return 0
          }

          # Construct Grafana URL based on access mode
          if [ "${{ env.GRAFANA_ACCESS_MODE }}" = "ingress-subpath" ]; then
            # Traefik ingress at /grafana subpath
            GRAFANA_URL="http://${{ env.GRAFANA_HOST }}${{ env.GRAFANA_SUBPATH }}"
            echo "Using Grafana ingress-subpath endpoint: ${GRAFANA_URL}"
          else
            # Fallback to NodePort or kubectl proxy
            SVC_TYPE=$(kubectl get svc -n monitoring "$GRAFANA_SERVICE" -o jsonpath='{.spec.type}')
            NODE_PORT=$(kubectl get svc -n monitoring "$GRAFANA_SERVICE" -o jsonpath='{.spec.ports[0].nodePort}')
            if [ "$SVC_TYPE" = "NodePort" ] && [ -n "$NODE_PORT" ]; then
              NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
              if [ -z "$NODE_IP" ]; then
                NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
              fi
              GRAFANA_URL="http://${NODE_IP}:${NODE_PORT}"
              echo "Using Grafana NodePort endpoint: ${GRAFANA_URL}"
            else
              GRAFANA_URL="http://127.0.0.1:8001/api/v1/namespaces/monitoring/services/http:${GRAFANA_SERVICE}:80/proxy"
              kubectl proxy --port=8001 >/tmp/kubectl-proxy.log 2>&1 &
              PROXY_PID=$!
              trap 'kill $PROXY_PID >/dev/null 2>&1 || true' EXIT
              echo "Using Grafana API service proxy endpoint"
            fi
          fi

          # Wait for Grafana to be reachable
          for i in $(seq 1 12); do
            if curl -sf -u "admin:${GRAFANA_PASS}" "${GRAFANA_URL}/api/health" > /dev/null 2>&1; then
              break
            fi
            echo "Waiting for Grafana... attempt $i"
            sleep 5
          done

          if ! curl -sf "${GRAFANA_URL}/api/health" > /dev/null 2>&1; then
            echo "Ingress/NodePort endpoint unreachable; falling back to kubectl proxy"
            GRAFANA_URL="http://127.0.0.1:8001/api/v1/namespaces/monitoring/services/http:${GRAFANA_SERVICE}:80/proxy"
            kubectl proxy --port=8001 >/tmp/kubectl-proxy.log 2>&1 &
            PROXY_PID=$!
            trap 'kill $PROXY_PID >/dev/null 2>&1 || true' EXIT

            for i in $(seq 1 12); do
              if curl -sf -u "admin:${GRAFANA_PASS}" "${GRAFANA_URL}/api/health" > /dev/null 2>&1; then
                break
              fi
              echo "Waiting for Grafana via kubectl proxy... attempt $i"
              sleep 5
            done
          fi

          curl -sS "${GRAFANA_URL}/api/health" > /dev/null \
            || { echo "Grafana health probe failed"; cat /tmp/kubectl-proxy.log 2>/dev/null || true; exit 1; }

          # Find credentials that can access authenticated Grafana API endpoints.
          CANDIDATE_SECRETS=$(printf "%s\n" "$GRAFANA_SECRET" && kubectl get secrets -n monitoring -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep -E 'grafana' || true)
          AUTH_OK=false
          for secret_name in $CANDIDATE_SECRETS; do
            if try_secret_creds "$secret_name"; then
              if curl -sf -u "${GRAFANA_USER}:${GRAFANA_PASS}" "${GRAFANA_URL}/api/user" > /dev/null 2>&1; then
                AUTH_OK=true
                echo "Using Grafana credentials from secret: ${secret_name}"
                break
              fi
            fi
          done

          if [ "$AUTH_OK" != "true" ]; then
            echo "Unable to authenticate to Grafana API with discovered secrets."
            kubectl get secrets -n monitoring | grep -i grafana || true
            exit 1
          fi

          DS_CODE=$(curl -sS -o /tmp/grafana-ds-response.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -u "${GRAFANA_USER}:${GRAFANA_PASS}" \
            -d '{"name":"Loki","type":"loki","uid":"loki","access":"proxy","url":"http://loki.loki.svc.cluster.local:3100","isDefault":false,"jsonData":{"maxLines":1000}}' \
            "${GRAFANA_URL}/api/datasources")

          if [ "$DS_CODE" = "200" ]; then
            echo "Loki datasource created"
          else
            DS_PUT_CODE=$(curl -sS -o /tmp/grafana-ds-response.json -w "%{http_code}" -X PUT \
              -H "Content-Type: application/json" \
              -u "${GRAFANA_USER}:${GRAFANA_PASS}" \
              -d '{"name":"Loki","type":"loki","uid":"loki","access":"proxy","url":"http://loki.loki.svc.cluster.local:3100","isDefault":false,"jsonData":{"maxLines":1000}}' \
              "${GRAFANA_URL}/api/datasources/uid/loki")
            if [ "$DS_PUT_CODE" != "200" ]; then
              echo "Loki datasource registration failed (POST ${DS_CODE}, PUT ${DS_PUT_CODE})"
              cat /tmp/grafana-ds-response.json || true
              exit 1
            fi
            echo "Loki datasource updated"
          fi
          echo "Loki datasource step completed"

      - name: Push dashboard to Grafana via API
        run: |
          PROXY_PID=""

          if kubectl get svc -n monitoring kube-prometheus-stack-grafana >/dev/null 2>&1; then
            GRAFANA_SERVICE=kube-prometheus-stack-grafana
            GRAFANA_SECRET=kube-prometheus-stack-grafana
          elif kubectl get svc -n monitoring prometheus-grafana >/dev/null 2>&1; then
            GRAFANA_SERVICE=prometheus-grafana
            GRAFANA_SECRET=prometheus-grafana
          else
            echo "Grafana service not found in monitoring namespace"
            kubectl get svc -n monitoring || true
            exit 1
          fi

          GRAFANA_USER=""
          GRAFANA_PASS=""

          try_secret_creds() {
            local secret_name="$1"
            local user pass

            user=$(kubectl get secret "$secret_name" -n monitoring -o jsonpath='{.data.admin-user}' 2>/dev/null | base64 -d 2>/dev/null || true)
            pass=$(kubectl get secret "$secret_name" -n monitoring -o jsonpath='{.data.admin-password}' 2>/dev/null | base64 -d 2>/dev/null || true)

            if [ -z "$user" ]; then
              user="admin"
            fi

            if [ -z "$pass" ]; then
              return 1
            fi

            GRAFANA_USER="$user"
            GRAFANA_PASS="$pass"
            return 0
          }

          # Construct Grafana URL (same as datasource registration)
          if [ "${{ env.GRAFANA_ACCESS_MODE }}" = "ingress-subpath" ]; then
            GRAFANA_URL="http://${{ env.GRAFANA_HOST }}${{ env.GRAFANA_SUBPATH }}"
            echo "Using Grafana ingress-subpath endpoint: ${GRAFANA_URL}"
          else
            SVC_TYPE=$(kubectl get svc -n monitoring "$GRAFANA_SERVICE" -o jsonpath='{.spec.type}')
            NODE_PORT=$(kubectl get svc -n monitoring "$GRAFANA_SERVICE" -o jsonpath='{.spec.ports[0].nodePort}')
            if [ "$SVC_TYPE" = "NodePort" ] && [ -n "$NODE_PORT" ]; then
              NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
              if [ -z "$NODE_IP" ]; then
                NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
              fi
              GRAFANA_URL="http://${NODE_IP}:${NODE_PORT}"
              echo "Using Grafana NodePort endpoint: ${GRAFANA_URL}"
            else
              GRAFANA_URL="http://127.0.0.1:8001/api/v1/namespaces/monitoring/services/http:${GRAFANA_SERVICE}:80/proxy"
              kubectl proxy --port=8001 >/tmp/kubectl-proxy.log 2>&1 &
              PROXY_PID=$!
              trap 'kill $PROXY_PID >/dev/null 2>&1 || true' EXIT
              echo "Using Grafana API service proxy endpoint"
            fi
          fi

          # Wait for Grafana to be reachable
          for i in $(seq 1 12); do
            curl -sf -u "admin:${GRAFANA_PASS}" "${GRAFANA_URL}/api/health" && break
            echo "Waiting for Grafana... attempt $i"
            sleep 10
          done

          if ! curl -sf -u "admin:${GRAFANA_PASS}" "${GRAFANA_URL}/api/health" > /dev/null 2>&1; then
            echo "Ingress/NodePort endpoint unreachable; falling back to kubectl proxy"
            GRAFANA_URL="http://127.0.0.1:8001/api/v1/namespaces/monitoring/services/http:${GRAFANA_SERVICE}:80/proxy"
            kubectl proxy --port=8001 >/tmp/kubectl-proxy.log 2>&1 &
            PROXY_PID=$!
            trap 'kill $PROXY_PID >/dev/null 2>&1 || true' EXIT

            for i in $(seq 1 12); do
              if curl -sf -u "admin:${GRAFANA_PASS}" "${GRAFANA_URL}/api/health" > /dev/null 2>&1; then
                break
              fi
              echo "Waiting for Grafana via kubectl proxy... attempt $i"
              sleep 5
            done
          fi

          curl -sS "${GRAFANA_URL}/api/health" > /dev/null \
            || { echo "Grafana health probe failed"; cat /tmp/kubectl-proxy.log 2>/dev/null || true; exit 1; }

          CANDIDATE_SECRETS=$(printf "%s\n" "$GRAFANA_SECRET" && kubectl get secrets -n monitoring -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep -E 'grafana' || true)
          AUTH_OK=false
          for secret_name in $CANDIDATE_SECRETS; do
            if try_secret_creds "$secret_name"; then
              if curl -sf -u "${GRAFANA_USER}:${GRAFANA_PASS}" "${GRAFANA_URL}/api/user" > /dev/null 2>&1; then
                AUTH_OK=true
                echo "Using Grafana credentials from secret: ${secret_name}"
                break
              fi
            fi
          done

          if [ "$AUTH_OK" != "true" ]; then
            echo "Unable to authenticate to Grafana API with discovered secrets."
            kubectl get secrets -n monitoring | grep -i grafana || true
            exit 1
          fi

          # Build and push K8sGPT Findings & Fixes dashboard
          python3 scripts/build_grafana_dashboard.py

          DASH_CODE=$(curl -sS -o /tmp/grafana-dashboard-response.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -u "${GRAFANA_USER}:${GRAFANA_PASS}" \
            -d @/tmp/grafana-payload.json \
            "${GRAFANA_URL}/api/dashboards/db")
          if [ "$DASH_CODE" != "200" ]; then
            echo "Dashboard import failed (HTTP ${DASH_CODE})"
            cat /tmp/grafana-dashboard-response.json || true
            exit 1
          fi
          echo "Dashboard import successful"
          echo "URL: ${GRAFANA_URL}/d/k8sgpt-findings-v2"

      - name: Verify deployment
        run: |
          kubectl get pods -n k8sgpt-operator-system
          kubectl get pods -n monitoring
          kubectl get k8sgpts -n k8sgpt-operator-system
