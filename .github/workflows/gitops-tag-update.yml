name: GitOps Image Tag Update

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'libs/**'
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/gitops-tag-update.yml'
      - 'flux/apps/devops-chatbot/helmrelease.yaml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override image tag instead of github.sha'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  update-tag:
    name: Update Flux HelmRelease Tag
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update HelmRelease values
        run: |
          set -euo pipefail
          FILE="flux/apps/devops-chatbot/helmrelease.yaml"
          TAG="${{ steps.tag.outputs.value }}"

          sed -i -E 's/(tag: ").*(")/\1'"${TAG}"'\2/' "$FILE"
          sed -i -E 's/(gitSha: ").*(")/\1'"${TAG}"'\2/' "$FILE"

          echo "Updated $FILE to image tag: $TAG"

      - name: Commit tag update
        run: |
          set -euo pipefail
          FILE="flux/apps/devops-chatbot/helmrelease.yaml"

          if git diff --quiet -- "$FILE"; then
            echo "No Flux tag update required"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(gitops): update devops-chatbot image tag to ${{ steps.tag.outputs.value }}"
          git push