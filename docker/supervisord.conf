[supervisord]
nodaemon=true
user=chatbot
logfile=/tmp/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp/supervisor
minfds=1024
minprocs=200

# Vestige MCP (HTTP) — colocated; SQLite + embeddings under chatbot PVC /data/vestige
# Inherits container env (MEMORY_BACKEND, VESTIGE_*, etc.) from Kubernetes.
[program:vestige]
command=/usr/local/bin/start-vestige.sh
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=30
stdout_logfile=/tmp/supervisor/vestige.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/tmp/supervisor/vestige_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
priority=10
environment=HOME="/tmp",PATH="/usr/local/bin:/usr/bin:/bin",VESTIGE_DATA_DIR="/data/vestige",FASTEMBED_CACHE_PATH="/data/vestige/model-cache"
killasgroup=true
stopasgroup=true

# FastAPI chatbot — waits briefly for local Vestige before binding
[program:backend]
command=/usr/local/bin/start-backend.sh
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=15
stopwaitsecs=30
stdout_logfile=/tmp/supervisor/backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/tmp/supervisor/backend_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
priority=20
environment=PATH="/opt/venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin",PYTHONUNBUFFERED="1",PYTHONOPTIMIZE="1",PYTHONPATH="/app/backend",HOME="/tmp"
killasgroup=true
stopasgroup=true
