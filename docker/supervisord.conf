[supervisord]
nodaemon=true
user=chatbot
logfile=/tmp/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=debug
pidfile=/tmp/supervisord.pid
childlogdir=/tmp/supervisor
minfds=1024
minprocs=200

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=10
stdout_logfile=/tmp/supervisor/nginx.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/tmp/supervisor/nginx_error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
priority=15

[program:backend]
command=/opt/venv/bin/uvicorn backend.app:app --host 127.0.0.1 --port 8000 --workers 1 --loop uvloop --http httptools
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=30
stdout_logfile=/tmp/supervisor/backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/tmp/supervisor/backend_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
priority=20
environment=PATH="/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",PYTHONUNBUFFERED="1",PYTHONOPTIMIZE="1",PYTHONPATH="/app/backend",LOG_LEVEL="DEBUG"
killasgroup=true
stopasgroup=true
