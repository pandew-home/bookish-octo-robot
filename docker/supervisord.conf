[supervisord]
nodaemon=true
user=chatbot
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor
minfds=1024
minprocs=200

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/nginx_error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
priority=10

[program:backend]
command=uvicorn backend.main:app --host 127.0.0.1 --port 8000 --workers 2 --loop uvloop --http httptools --no-access-log
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/backend_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=2
priority=20
environment=PYTHONUNBUFFERED="1",PYTHONOPTIMIZE="1"
killasgroup=true
stopasgroup=true
