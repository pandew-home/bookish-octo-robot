apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bookish-octo-robot
  sources:
    - repoURL: https://github.com/pandew-home/bookish-octo-robot.git
      targetRevision: main
      ref: values
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.2.0
      helm:
        valueFiles:
          - $values/k8sgpt/Alloy/kube-prometheus-stack-values-base.yaml
          - $values/k8sgpt/Alloy/kube-prometheus-stack-values-civo-traefik.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      # Heavier than other apps because this chart's CRDs and PVC creation
      # can take several minutes on first install.
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
