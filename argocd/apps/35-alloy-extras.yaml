apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-extras
  namespace: argocd
  annotations:
    # After the alloy chart so the alloy SA exists before the scraper CronJob runs.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bookish-octo-robot
  source:
    repoURL: https://github.com/pandew-home/bookish-octo-robot.git
    targetRevision: main
    path: helm/alloy-extras
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
