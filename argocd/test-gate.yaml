apiVersion: v1
kind: ConfigMap
metadata:
  name: test-gate-config
  namespace: devops-chatbot-test
  labels:
    app: test-gate
data:
  # Test gate configuration
  gate-enabled: "true"
  required-tests: |
    - auth.spec.ts
    - cluster.spec.ts
    - weather.spec.ts
    - chat.spec.ts
  minimum-success-rate: "95"
  allow-failures: |
    - error-scenarios.spec.ts (known intermittent)
  timeout-minutes: "30"

---
apiVersion: v1
kind: Secret
metadata:
  name: test-gate-secrets
  namespace: devops-chatbot-test
type: Opaque
data:
  # Base64 encoded secrets for test execution
  github-token: <base64-encoded-github-token>
  argocd-token: <base64-encoded-argocd-token>
  slack-webhook: <base64-encoded-slack-webhook>

---
apiVersion: batch/v1
kind: Job
metadata:
  name: test-gate-verifier
  namespace: devops-chatbot-test
  labels:
    app: test-gate
spec:
  template:
    spec:
      serviceAccountName: test-gate-sa
      containers:
      - name: verifier
        image: curlimages/curl:latest
        command:
          - /bin/sh
          - -c
        args:
          - |
            # Check if tests passed for the current commit
            COMMIT_SHA=$(cat /workspace/commit-sha)
            TEST_RESULTS_URL="https://api.github.com/repos/your-org/devops-chatbot/actions/runs"

            # Query GitHub API for test results
            RESPONSE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              "$TEST_RESULTS_URL?head_sha=$COMMIT_SHA&status=completed")

            # Check if E2E tests passed
            if echo "$RESPONSE" | jq -e '.workflow_runs[] | select(.name == "E2E Tests") | .conclusion == "success"' > /dev/null; then
              echo "Tests passed - allowing deployment"
              exit 0
            else
              echo "Tests failed or not completed - blocking deployment"
              exit 1
            fi
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: test-gate-secrets
                key: github-token
        volumeMounts:
          - name: workspace
            mountPath: /workspace
      volumes:
        - name: workspace
          configMap:
            name: deployment-config
      restartPolicy: Never
  backoffLimit: 0

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-gate-sa
  namespace: devops-chatbot-test

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: test-gate-role
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: test-gate-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: test-gate-role
subjects:
- kind: ServiceAccount
  name: test-gate-sa
  namespace: devops-chatbot-test

---
# ArgoCD pre-sync hook to run test verification
apiVersion: batch/v1
kind: Job
metadata:
  name: pre-deployment-test-check
  namespace: devops-chatbot-production
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: argocd-manager
      containers:
      - name: test-check
        image: bitnami/kubectl:latest
        command:
          - /bin/sh
          - -c
        args:
          - |
            # Get the commit SHA from ArgoCD
            COMMIT_SHA=$ARGOCD_APP_REVISION

            # Create test gate job
            cat <<EOF | kubectl apply -f -
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: test-verification-${COMMIT_SHA:0:8}
              namespace: devops-chatbot-test
            spec:
              template:
                spec:
                  containers:
                  - name: verifier
                    image: curlimages/curl:latest
                    command: ["/bin/sh", "-c"]
                    args:
                    - |
                      echo "Verifying tests for commit: $COMMIT_SHA"

                      # Check GitHub Actions API
                      RUNS_URL="https://api.github.com/repos/your-org/devops-chatbot/actions/runs"
                      RESPONSE=\$(curl -s -H "Authorization: Bearer \$GITHUB_TOKEN" \
                        "\$RUNS_URL?head_sha=\$COMMIT_SHA&event=push&status=completed")

                      # Find the latest E2E test run
                      TEST_STATUS=\$(echo "\$RESPONSE" | jq -r '.workflow_runs[] | select(.name == "E2E Tests") | .conclusion' | head -1)

                      if [ "\$TEST_STATUS" = "success" ]; then
                        echo "✅ Tests passed - proceeding with deployment"
                        exit 0
                      elif [ "\$TEST_STATUS" = "failure" ]; then
                        echo "❌ Tests failed - blocking deployment"
                        exit 1
                      else
                        echo "⏳ Tests still running or not found - blocking deployment"
                        exit 1
                      fi
                    env:
                    - name: GITHUB_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: test-gate-secrets
                          key: github-token
                          optional: true
                  restartPolicy: Never
            EOF

            # Wait for test verification job to complete
            kubectl wait --for=condition=complete --timeout=600s job/test-verification-${COMMIT_SHA:0:8} -n devops-chatbot-test

            # Check if job succeeded
            if kubectl get job test-verification-${COMMIT_SHA:0:8} -n devops-chatbot-test -o jsonpath='{.status.succeeded}'; then
              echo "Test verification passed"
            else
              echo "Test verification failed - deployment blocked"
              exit 1
            fi
      restartPolicy: Never
  backoffLimit: 0