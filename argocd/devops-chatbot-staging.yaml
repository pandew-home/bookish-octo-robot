apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-chatbot-staging
  namespace: argocd
  labels:
    environment: staging
    team: platform
  annotations:
    argocd.argoproj.io/manifest-generate-paths: k8s/staging
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/devops-chatbot-gitops
    targetRevision: HEAD
    path: k8s/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-chatbot-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-chatbot-production
  namespace: argocd
  labels:
    environment: production
    team: platform
  annotations:
    argocd.argoproj.io/manifest-generate-paths: k8s/production
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: your-slack-channel
    notifications.argoproj.io/subscribe.on-sync-failed.slack: your-slack-channel
spec:
  project: production
  source:
    repoURL: https://github.com/your-org/devops-chatbot-gitops
    targetRevision: HEAD
    path: k8s/production
    helm:
      valueFiles:
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-chatbot-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Validate=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 20

---
# Test gate for production deployments
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-chatbot-test-gate
  namespace: argocd
  labels:
    environment: production
    component: test-gate
spec:
  project: production
  source:
    repoURL: https://github.com/your-org/devops-chatbot-gitops
    targetRevision: HEAD
    path: test-gates/production
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-chatbot-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
# Rollback application for emergency rollbacks
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-chatbot-rollback
  namespace: argocd
  labels:
    environment: production
    component: rollback
spec:
  project: production
  source:
    repoURL: https://github.com/your-org/devops-chatbot-gitops
    targetRevision: HEAD
    path: k8s/rollback
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-chatbot-production
  syncPolicy:
    automated: false  # Manual trigger only
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground