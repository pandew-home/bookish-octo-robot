apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8sgpt-instance
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: k8sgpt-operator
  path: ./flux/apps/k8sgpt-instance
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: bookish-octo-robot