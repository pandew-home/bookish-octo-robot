apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8sgpt-operator
  namespace: flux-system
spec:
  interval: 5m
  releaseName: k8sgpt-operator
  targetNamespace: k8sgpt-operator-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: k8sgpt-operator
      version: "0.2.27"
      sourceRef:
        kind: HelmRepository
        name: k8sgpt-operator
        namespace: flux-system
      interval: 30m
  values:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    serviceMonitor:
      enabled: true
    metrics:
      enabled: true
    dynamicRBAC:
      enabled: true
    resultLogging:
      enabled: false