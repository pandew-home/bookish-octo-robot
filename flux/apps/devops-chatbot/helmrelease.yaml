apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: devops-chatbot
  namespace: flux-system
spec:
  interval: 5m
  releaseName: devops-chatbot
  targetNamespace: devops-chatbot
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./helm/devops-chatbot
      sourceRef:
        kind: GitRepository
        name: bookish-octo-robot
        namespace: flux-system
      interval: 1m
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/pandew-home/bookish-octo-robot
      tag: "0828e1dff3c69b69e55b1c4a59771988e57d1f6d"
    podLabels:
      gitSha: "0828e1dff3c69b69e55b1c4a59771988e57d1f6d"
    llm:
      createSecret: false
      existingSecret: devops-chatbot-secrets