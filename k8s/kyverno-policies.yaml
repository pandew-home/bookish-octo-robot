---
# Kyverno ClusterPolicy: Require non-root containers
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: Require Non-Root Containers
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers must run as non-root users. This policy ensures
      runAsNonRoot is set to true in the pod and container security contexts.
spec:
  validationFailureAction: enforce
  background: true
  rules:
  - name: check-runAsNonRoot
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Running as root is not allowed. Set runAsNonRoot to true."
      pattern:
        spec:
          securityContext:
            runAsNonRoot: true
          containers:
          - securityContext:
              runAsNonRoot: true

---
# Kyverno ClusterPolicy: Require read-only root filesystem
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-ro-rootfs
  annotations:
    policies.kyverno.io/title: Require Read-Only Root Filesystem
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers should run with a read-only root filesystem to prevent
      modification of the container image at runtime.
spec:
  validationFailureAction: enforce
  background: true
  rules:
  - name: check-readOnlyRootFilesystem
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Root filesystem must be read-only. Set readOnlyRootFilesystem to true."
      pattern:
        spec:
          containers:
          - securityContext:
              readOnlyRootFilesystem: true

---
# Kyverno ClusterPolicy: Drop all capabilities
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: drop-all-capabilities
  annotations:
    policies.kyverno.io/title: Drop All Capabilities
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers should drop all Linux capabilities and only add back
      the specific capabilities they need.
spec:
  validationFailureAction: enforce
  background: true
  rules:
  - name: check-drop-all-capabilities
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "All capabilities must be dropped. Set capabilities.drop to [ALL]."
      pattern:
        spec:
          containers:
          - securityContext:
              capabilities:
                drop:
                - ALL

---
# Kyverno ClusterPolicy: Disallow privilege escalation
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privilege escalation should be disabled to prevent containers
      from gaining more privileges than their parent process.
spec:
  validationFailureAction: enforce
  background: true
  rules:
  - name: check-allowPrivilegeEscalation
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Privilege escalation is not allowed. Set allowPrivilegeEscalation to false."
      pattern:
        spec:
          containers:
          - securityContext:
              allowPrivilegeEscalation: false

---
# Kyverno ClusterPolicy: Require seccomp profile
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-seccomp-profile
  annotations:
    policies.kyverno.io/title: Require Seccomp Profile
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Seccomp profiles should be set to RuntimeDefault or Localhost
      to restrict syscalls available to containers.
spec:
  validationFailureAction: enforce
  background: true
  rules:
  - name: check-seccomp-profile
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Seccomp profile must be set to RuntimeDefault or Localhost."
      anyPattern:
      - spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
      - spec:
          securityContext:
            seccompProfile:
              type: Localhost

---
# Kyverno ClusterPolicy: Restrict volume types
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-volume-types
  annotations:
    policies.kyverno.io/title: Restrict Volume Types
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Only specific volume types should be allowed. HostPath volumes
      are particularly dangerous and should be restricted.
spec:
  validationFailureAction: enforce
  background: true
  rules:
  - name: check-volume-types
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Only configMap, emptyDir, persistentVolumeClaim, secret, and projected volumes are allowed."
      deny:
        conditions:
          any:
          - key: "{{ request.object.spec.volumes[?hostPath] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?gcePersistentDisk] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?awsElasticBlockStore] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?gitRepo] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?nfs] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?iscsi] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?glusterfs] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?rbd] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?flexVolume] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?cinder] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?cephfs] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?flocker] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?fc] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?azureFile] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?vsphereVolume] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?quobyte] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?azureDisk] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?portworxVolume] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?scaleIO] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?storageos] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.volumes[?csi] | length(@) }}"
            operator: GreaterThan
            value: 0

---
# Kyverno ClusterPolicy: Restrict hostPath volumes
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-hostpath
  annotations:
    policies.kyverno.io/title: Restrict HostPath Volumes
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      HostPath volumes allow access to the host filesystem and should
      be restricted. This policy blocks all hostPath volumes.
spec:
  validationFailureAction: enforce
  background: true
  rules:
  - name: check-hostpath
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "HostPath volumes are not allowed."
      pattern:
        spec:
          =(volumes):
          - X(hostPath): "null"

---
# Kyverno ClusterPolicy: Restrict host namespaces
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-host-namespaces
  annotations:
    policies.kyverno.io/title: Restrict Host Namespaces
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Sharing the host namespaces (PID, IPC, Network) should be restricted.
spec:
  validationFailureAction: enforce
  background: true
  rules:
  - name: check-host-namespaces
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Sharing host namespaces is not allowed."
      pattern:
        spec:
          =(hostPID): false
          =(hostIPC): false
          =(hostNetwork): false

---
# Kyverno ClusterPolicy: Restrict privileged containers
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-privileged-containers
  annotations:
    policies.kyverno.io/title: Restrict Privileged Containers
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privileged containers have access to all host resources and should
      be restricted.
spec:
  validationFailureAction: enforce
  background: true
  rules:
  - name: check-privileged
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Privileged containers are not allowed."
      pattern:
        spec:
          containers:
          - =(securityContext):
              =(privileged): false

---
# Kyverno ClusterPolicy: Require resource limits
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All containers should have CPU and memory limits defined to
      prevent resource exhaustion.
spec:
  validationFailureAction: enforce
  background: true
  rules:
  - name: check-resource-limits
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "CPU and memory limits are required for all containers."
      pattern:
        spec:
          containers:
          - resources:
              limits:
                memory: "?*"
                cpu: "?*"
              requests:
                memory: "?*"
                cpu: "?*"

---
# Kyverno ClusterPolicy: Restrict image registries
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Only images from approved registries should be allowed.
      Modify the allowed registries list as needed.
spec:
  validationFailureAction: enforce
  background: true
  rules:
  - name: check-image-registry
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Images must come from approved registries: docker.io, gcr.io, ghcr.io, quay.io, or your private registry."
      foreach:
      - list: "request.object.spec.containers"
        pattern:
          image: "docker.io/* | gcr.io/* | ghcr.io/* | quay.io/* | *.dkr.ecr.*.amazonaws.com/*"

---
# Kyverno ClusterPolicy: Require labels
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod, Deployment, Service
    policies.kyverno.io/description: >-
      All resources should have standard labels for organization
      and management.
spec:
  validationFailureAction: enforce
  background: true
  rules:
  - name: check-labels
    match:
      any:
      - resources:
          kinds:
          - Pod
          - Deployment
          - Service
    validate:
      message: "Resources must have 'app' and 'version' labels."
      pattern:
        metadata:
          labels:
            app: "?*"
            version: "?*"

---
# Kyverno ClusterPolicy: Restrict secrets access in RBAC
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-secrets-rbac
  annotations:
    policies.kyverno.io/title: Restrict Secrets Access in RBAC
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: ClusterRole, Role
    policies.kyverno.io/description: >-
      RBAC roles should not have broad access to secrets. Use
      resourceNames to restrict access to specific secrets.
spec:
  validationFailureAction: enforce
  background: true
  rules:
  - name: check-secrets-access
    match:
      any:
      - resources:
          kinds:
          - ClusterRole
          - Role
    validate:
      message: "Broad secrets access (list, watch, *) requires resourceNames restriction."
      deny:
        conditions:
          any:
          - key: "{{ request.object.rules[?resources[?contains(@, 'secrets')]].verbs[] }}"
            operator: AnyIn
            value: ["*", "list", "watch"]
            preconditions:
              all:
              - key: "{{ request.object.rules[?resources[?contains(@, 'secrets')]].resourceNames[] | length(@) }}"
                operator: Equals
                value: 0

---
# Kyverno ClusterPolicy: Require probes
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require Liveness and Readiness Probes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All containers should have liveness and readiness probes
      defined for proper health monitoring.
spec:
  validationFailureAction: enforce
  background: true
  rules:
  - name: check-probes
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Liveness and readiness probes are required."
      pattern:
        spec:
          containers:
          - livenessProbe:
              periodSeconds: ">0"
            readinessProbe:
              periodSeconds: ">0"

---
# Kyverno ClusterPolicy: Disallow latest tag
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Container images should use specific tags, not 'latest',
      for reproducibility and security.
spec:
  validationFailureAction: enforce
  background: true
  rules:
  - name: check-image-tag
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Using 'latest' tag is not allowed. Use specific version tags."
      foreach:
      - list: "request.object.spec.containers"
        deny:
          conditions:
            any:
            - key: "{{ element.image }}"
              operator: Equals
              value: "*:latest"
            - key: "{{ element.image }}"
              operator: NotEquals
              value: "*:*"
