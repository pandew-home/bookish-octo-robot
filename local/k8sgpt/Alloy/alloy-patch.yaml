spec:
  template:
    spec:
      containers:
        - name: alloy
          env:
            - name: CLUSTER_NAME
              value: bookish-octo-robot
            - name: LOKI_URL
              value: http://loki.loki.svc:3100/loki/api/v1/push
            - name: PROMETHEUS_URL
              value: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090/api/v1/write
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
