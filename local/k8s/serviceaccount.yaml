apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-chatbot
  namespace: devops-chatbot
  labels:
    app: devops-chatbot
---
# Pod SA is K8sGPT Result CRD read-only. Live cluster diagnostics use
# per-session user credentials (Kion/EKS or kubeconfig), not this SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devops-chatbot-k8sgpt-reader
  labels:
    app: devops-chatbot
rules:
- apiGroups: ["core.k8sgpt.ai"]
  resources: ["results"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-chatbot-k8sgpt-reader
  labels:
    app: devops-chatbot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devops-chatbot-k8sgpt-reader
subjects:
- kind: ServiceAccount
  name: devops-chatbot
  namespace: devops-chatbot
