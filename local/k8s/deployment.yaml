apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-chatbot
  namespace: devops-chatbot
  labels:
    app: devops-chatbot
    version: v2.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-chatbot
  template:
    metadata:
      labels:
        app: devops-chatbot
        version: v2.0
      annotations:
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      serviceAccountName: devops-chatbot
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: setup-dirs
        image: busybox:1.35
        command: ['sh', '-c', 'mkdir -p /tmp/supervisor /tmp/envoy /var/log/supervisor /var/run/supervisor']
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: log
          mountPath: /var/log
        - name: run
          mountPath: /var/run
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 1000
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      containers:
      - name: chatbot
        image: localhost:5000/devops-chatbot:local-test
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: LLM_PROVIDER
          valueFrom:
            secretKeyRef:
              name: devops-chatbot-secrets
              key: llm-provider
        - name: LLM_MODEL
          valueFrom:
            secretKeyRef:
              name: devops-chatbot-secrets
              key: llm-model
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: devops-chatbot-secrets
              key: llm-api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: devops-chatbot-secrets
              key: llm-api-key
        - name: OPENAI_BASE_URL
          value: "https://openrouter.ai/api/v1"
        - name: DEFAULT_REGION
          value: "us-east-1"
        - name: KB_SEEDING_ENABLED
          value: "true"
        - name: KB_FORCE_RESEED
          value: "false"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: log
          mountPath: /var/log
        - name: run
          mountPath: /var/run
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: devops-chatbot-pvc
      - name: tmp
        emptyDir: {}
      - name: log
        emptyDir: {}
      - name: run
        emptyDir: {}
