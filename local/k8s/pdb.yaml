---
# PodDisruptionBudget for DevOps Chatbot
# Ensures at least 1 pod is always available during disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devops-chatbot-pdb
  namespace: devops-chatbot
  labels:
    app: devops-chatbot
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: devops-chatbot
  unhealthyPodEvictionPolicy: IfHealthyBudget
