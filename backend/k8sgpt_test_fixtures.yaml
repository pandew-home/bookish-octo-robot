# Example 1: Pod CrashLoopBackOff (High Severity)
apiVersion: core.k8sgpt.ai/v1alpha1
kind: Result
metadata:
  name: default-nginx-deployment-7d6b8c9f4d-x7k2m
  namespace: default
  creationTimestamp: "2024-01-15T10:30:00Z"
spec:
  kind: Pod
  name: nginx-deployment-7d6b8c9f4d-x7k2m
  namespace: default
  details: "Pod default/nginx-deployment-7d6b8c9f4d-x7k2m is in CrashLoopBackOff state"
  error:
    - "Container 'nginx' is in CrashLoopBackOff state"
    - "Last termination reason: Error"
    - "Exit code: 1"
    - "Back-off 5m0s restarting failed container"
    - "Solution: Check application logs using 'kubectl logs nginx-deployment-7d6b8c9f4d-x7k2m'. Verify the container image and startup command are correct. Check for missing environment variables or configuration files."
  backend: openai

