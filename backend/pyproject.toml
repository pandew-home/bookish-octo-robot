[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-chatbot-backend"
version = "2.0.0"
description = "DevOps Chatbot backend services"
requires-python = ">=3.12"

[tool.setuptools]
packages = {find = {where = ["."], exclude = ["tests*", "venv*", "__pycache__*"]}}
py-modules = [
  "app",
  "agentic_engine",
  "agent_tools",
  "cluster_manager",
  "conversation_history",
  "credential_store",
  "eks_auth",
  "k8s_client",
  "k8sgpt_reader",
  "rag_integration",
  "skills",
  "startup_validator",
  "weather_calculator"
]
